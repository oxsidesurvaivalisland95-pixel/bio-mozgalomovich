<script>

let user = localStorage.getItem("user") || null;
let cart = [];
let orders = JSON.parse(localStorage.getItem("orders") || "[]");
let admin = false;

/* =========================
   LOAD USER SAFE
========================= */
function load(){

if(!user){
cart = [];
return;
}

cart = JSON.parse(localStorage.getItem("cart_"+user) || "[]");
}

/* =========================
   SET USER
========================= */
function setUser(name){
user = name;
localStorage.setItem("user", user);
load();
render();
}

/* =========================
   REGISTER
========================= */
function register(){

let name = document.getElementById("login").value.trim();
let pass = document.getElementById("pass").value;

if(!name){
alert("введи логин");
return;
}

if(!localStorage.getItem("acc_"+name)){
localStorage.setItem("acc_"+name, JSON.stringify({pass:pass || ""}));
localStorage.setItem("cart_"+name,"[]");
localStorage.setItem("history_"+name,"[]");
}

setUser(name);
}

/* =========================
   LOGIN
========================= */
function login(){

let name = document.getElementById("login").value.trim();
let pass = document.getElementById("pass").value;

let accRaw = localStorage.getItem("acc_"+name);

if(!accRaw){
alert("аккаунт не найден");
return;
}

let acc = JSON.parse(accRaw || "{}");

if(acc.pass !== pass){
alert("неверный пароль");
return;
}

setUser(name);
}

/* =========================
   ADD CART
========================= */
function add(item){

if(!user){
alert("сначала войди");
return;
}

cart.push(item);
localStorage.setItem("cart_"+user, JSON.stringify(cart));
render();
}

/* =========================
   REMOVE CART ITEM
========================= */
function removeItem(i){
cart.splice(i,1);
localStorage.setItem("cart_"+user, JSON.stringify(cart));
render();
}

/* =========================
   ORDER CREATE
========================= */
function order(i){

let item = cart[i];

let order = {
id: Date.now(),
user: user,
item: item,
status: "ожидает"
};

orders.push(order);
localStorage.setItem("orders", JSON.stringify(orders));

/* history per user */
let h = JSON.parse(localStorage.getItem("history_"+user) || "[]");
h.push(item);
localStorage.setItem("history_"+user, JSON.stringify(h));

/* optional telegram notify (simple) */
fetch("https://api.telegram.org/botYOUR_BOT_TOKEN/sendMessage", {
method:"POST",
headers:{"Content-Type":"application/json"},
body: JSON.stringify({
chat_id:"YOUR_CHAT_ID",
text:`🛒 Новый заказ\nUser: ${user}\nItem: ${item}`
})
}).catch(()=>{});

render();
}

/* =========================
   ADMIN LOGIN
========================= */
function adminLogin(){

let pass = document.getElementById("adminPass").value;

if(pass === "rahim_45_pro"){
admin = true;
alert("admin OK");
render();
}else{
alert("wrong password");
}
}

/* =========================
   CHANGE STATUS
========================= */
function setStatus(id,status){

orders = orders.map(o=>{
if(o.id === id){
o.status = status;
}
return o;
});

localStorage.setItem("orders", JSON.stringify(orders));
render();
}

/* =========================
   RENDER
========================= */
function render(){

/* CART */
if(document.getElementById("cart").classList.contains("active")){
let c = document.getElementById("cart");
c.innerHTML = "";

if(!cart.length){
c.innerHTML = `<div class="card">корзина пуста</div>`;
return;
}

cart.forEach((i,idx)=>{
c.innerHTML += `
<div class="card">
${i}
<button onclick="order(${idx})">заказать</button>
<button onclick="removeItem(${idx})">удалить</button>
</div>`;
});
}

/* HISTORY */
if(document.getElementById("history").classList.contains("active")){
let h = document.getElementById("history");
h.innerHTML = "";

let data = JSON.parse(localStorage.getItem("history_"+user) || "[]");

if(!data.length){
h.innerHTML = `<div class="card">история пуста</div>`;
return;
}

data.slice().reverse().forEach(i=>{
h.innerHTML += `
<div class="card">
transaction<br>${i}
</div>`;
});
}

/* ADMIN */
if(admin){
let a = document.getElementById("adminPanel");
a.innerHTML = "";

orders.slice().reverse().forEach(o=>{
a.innerHTML += `
<div class="card">
USER: ${o.user}<br>
ITEM: ${o.item}<br>
STATUS: ${o.status}
<button onclick="setStatus(${o.id},'оплачено')">оплачено</button>
<button onclick="setStatus(${o.id},'отменено')">отменить</button>
</div>`;
});
}

}

/* INIT */
load();
render();

</script>
