<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CYBER SHOP</title>

<style>
body{
margin:0;
font-family:Arial;
background:#05070d;
color:white;
overflow-x:hidden;
}

/* ===== NEON ===== */
.title{
text-align:center;
font-size:42px;
padding:15px;
color:#00ffe5;
text-shadow:0 0 25px #00ffe5,0 0 40px #ff00ff;
animation:glow 2s infinite;
}

@keyframes glow{
0%{text-shadow:0 0 5px #00ffe5}
50%{text-shadow:0 0 25px #ff00ff}
100%{text-shadow:0 0 5px #00ffe5}
}

/* ===== FALLING EFFECT ===== */
.particle{
position:fixed;
top:-10px;
width:6px;
height:6px;
background:#00ffe5;
border-radius:50%;
opacity:.6;
animation:fall linear infinite;
}

@keyframes fall{
to{transform:translateY(110vh)}
}

/* ===== UI ===== */
.page{display:none;padding:20px}
.page.active{display:block}

.card{
background:#101826;
border:1px solid #00ffe5;
padding:15px;
margin:10px auto;
border-radius:12px;
max-width:420px;
animation:fade .2s ease;
}

@keyframes fade{
from{opacity:0;transform:scale(.95)}
to{opacity:1;transform:scale(1)}
}

button{
width:100%;
margin-top:8px;
padding:10px;
border:none;
border-radius:10px;
background:linear-gradient(90deg,#00ffe5,#ff00ff);
color:white;
font-weight:bold;
cursor:pointer;
}

input{
width:100%;
padding:10px;
margin-top:8px;
border-radius:10px;
border:none;
background:#0d1018;
color:white;
}

.nav{
position:fixed;
top:10px;
right:10px;
display:flex;
gap:6px;
z-index:999;
}

</style>
</head>

<body>

<div class="title">CYBER SHOP</div>

<div class="nav">
<button onclick="show('home')">home</button>
<button onclick="show('cart')">cart</button>
<button onclick="show('history')">history</button>
<button onclick="show('admin')">admin</button>
</div>

<!-- HOME -->
<div id="home" class="page active">

<div class="card">
1 неделя — 300₽ / 4$ / 2 TON
<button onclick="add('1 неделя')">добавить</button>
</div>

<div class="card">
1 месяц — 1000₽ / 13$ / 6 TON
<button onclick="add('1 месяц')">добавить</button>
</div>

<div class="card">
навсегда — 4000₽ / 52$ / 25 TON
<button onclick="add('навсегда')">добавить</button>
</div>

<div class="card">
💳 TON WALLET:
<br><br>
UQAYHaet-WWovXy7HoH84ud8cz_VjENJAmuEySnVe9aiw2Dv
</div>

<div class="card">
<input id="login" placeholder="login">
<input id="pass" placeholder="password">
<button onclick="register()">register</button>
<button onclick="login()">login</button>
</div>

</div>

<!-- CART -->
<div id="cart" class="page"></div>

<!-- HISTORY -->
<div id="history" class="page"></div>

<!-- ADMIN -->
<div id="admin" class="page">

<div class="card">
<input id="adminPass" placeholder="admin password">
<button onclick="adminLogin()">login admin</button>
</div>

<div id="adminPanel"></div>

</div>

<script>

/* ===== SAFE GUARD (ЧТОБЫ НЕ БЫЛ БЕЛЫЙ ЭКРАН) ===== */
window.onerror = () => true;

/* ===== STATE ===== */
let user = localStorage.getItem("user") || null;
let cart = [];
let admin = false;
let orders = JSON.parse(localStorage.getItem("orders") || "[]");

/* ===== LOAD USER DATA ===== */
function load(){
if(user){
cart = JSON.parse(localStorage.getItem("cart_"+user) || "[]");
}
}

/* ===== NAV ===== */
function show(id){
document.querySelectorAll(".page").forEach(p=>p.classList.remove("active"));
document.getElementById(id).classList.add("active");
render();
}

/* ===== AUTH ===== */
function register(){
let u = login.value;
let p = pass.value;

if(!u||!p) return;

let users = JSON.parse(localStorage.getItem("users") || "{}");

users[u] = {pass:p};
localStorage.setItem("users",JSON.stringify(users));

localStorage.setItem("cart_"+u,"[]");
localStorage.setItem("history_"+u,"[]");

user = u;
localStorage.setItem("user",u);

load();
render();
}

function login(){
let u = login.value;
let p = pass.value;

let users = JSON.parse(localStorage.getItem("users") || "{}");

if(users[u] && users[u].pass === p){
user = u;
localStorage.setItem("user",u);

load();
render();
}
}

/* ===== CART ===== */
function add(item){
if(!user) return;

cart.push(item);
localStorage.setItem("cart_"+user,JSON.stringify(cart));

render();
}

/* ===== ORDER ===== */
function order(i){
if(!user) return;

let item = cart[i];

orders.push({
id:Date.now(),
user:user,
item:item,
status:"pending"
});

localStorage.setItem("orders",JSON.stringify(orders));

let h = JSON.parse(localStorage.getItem("history_"+user) || "[]");
h.push(item);
localStorage.setItem("history_"+user,JSON.stringify(h));

render();
}

/* ===== ADMIN ===== */
function adminLogin(){
if(adminPass.value === "admin123"){
admin = true;
render();
}
}

function setStatus(id,status){
orders = orders.map(o=>{
if(o.id===id)o.status=status;
return o;
});
localStorage.setItem("orders",JSON.stringify(orders));
render();
}

/* ===== RENDER SAFE ===== */
function render(){

/* CART */
let c = document.getElementById("cart");
c.innerHTML = "";

if(user){
cart = JSON.parse(localStorage.getItem("cart_"+user) || "[]");

cart.forEach((i,idx)=>{
c.innerHTML += `
<div class="card">
${i}
<button onclick="order(${idx})">buy</button>
</div>`;
});
}

/* HISTORY */
let h = document.getElementById("history");
h.innerHTML = "";

if(user){
let data = JSON.parse(localStorage.getItem("history_"+user) || "[]");

data.forEach(i=>{
h.innerHTML += `<div class="card">${i}</div>`;
});
}

/* ADMIN */
let a = document.getElementById("adminPanel");
a.innerHTML = "";

if(admin){
orders.forEach(o=>{
a.innerHTML += `
<div class="card">
USER: ${o.user}<br>
ITEM: ${o.item}<br>
STATUS: ${o.status}
<button onclick="setStatus(${o.id},'paid')">paid</button>
<button onclick="setStatus(${o.id},'cancel')">cancel</button>
</div>`;
});
}

}

/* ===== PARTICLES ===== */
for(let i=0;i<25;i++){
let p=document.createElement("div");
p.className="particle";
p.style.left=Math.random()*100+"vw";
p.style.animationDuration=(3+Math.random()*5)+"s";
document.body.appendChild(p);
}

render();

</script>

</body>
</html>
