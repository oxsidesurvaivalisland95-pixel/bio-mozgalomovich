<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MOZGALOM ELITE | CYBER-BUNKER v3</title>

    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;900&family=Montserrat:wght@400;700&family=JetBrains+Mono&display=swap" rel="stylesheet">

    <style>
        :root { --n: #00ffe5; --p: #ff00ff; --bg: #05070d; --card: rgba(255, 255, 255, 0.08); --neon-g: #00ff41; --sakura: #ffb7c5; --gold: #ffcc00; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }
        body { margin:0; font-family: 'Montserrat', sans-serif; background: var(--bg); color: #fff; min-height: 100vh; overflow-x: hidden; }

        /* ЭКРАН ЗАГРУЗКИ */
        #boot-screen { position: fixed; inset: 0; background: #000; z-index: 10000; display: flex; flex-direction: column; justify-content: center; padding: 30px; font-family: 'JetBrains Mono', monospace; color: var(--neon-g); font-size: 14px; }
        #bg-canvas { position: fixed; top: 0; left: 0; z-index: -1; opacity: 0.4; pointer-events: none; }

        /* КАРТА АТАК (BRIDGE MAP) */
        #bridge-map { position: absolute; inset: 0; opacity: 0.2; pointer-events: none; z-index: -1; overflow: hidden; background: url('https://upload.wikimedia.org/wikipedia/commons/8/80/World_map_blank_without_borders.svg') center/cover no-repeat; filter: invert(1); }
        .attack-ping { position: absolute; width: 4px; height: 4px; background: var(--p); border-radius: 50%; box-shadow: 0 0 10px var(--p); animation: ping 2s infinite; }
        @keyframes ping { 0% { transform: scale(1); opacity: 1; } 100% { transform: scale(10); opacity: 0; } }

        .header { text-align:center; padding:20px; border-bottom: 2px solid var(--p); background: rgba(0,0,0,0.7); backdrop-filter: blur(15px); position: relative; z-index: 1001; }
        .neon-title { font-family: 'Orbitron'; font-size: 24px; font-weight: 900; background: linear-gradient(90deg, var(--n), var(--p), var(--sakura)); background-size: 200%; -webkit-background-clip: text; -webkit-text-fill-color: transparent; animation: shine 4s linear infinite; text-transform: uppercase; letter-spacing: 3px; cursor: pointer; display: inline-block; }
        @keyframes shine { to { background-position: 200%; } }

        .nav { display:flex; gap:8px; padding:10px; overflow-x:auto; background: rgba(0,0,0,0.9); position:sticky; top:0; z-index:1000; border-bottom: 1px solid var(--n); scrollbar-width: none; }
        .nav::-webkit-scrollbar { display: none; }
        .nav button { flex:0 0 auto; background:transparent; border:1px solid var(--n); padding:8px 15px; border-radius:10px; color:var(--n); font-weight:bold; font-size:10px; cursor:pointer; font-family: 'Orbitron'; transition: 0.3s; }
        .nav button.active { background: var(--p); color:#fff; border-color: var(--p); box-shadow: 0 0 15px var(--p); }

        .page { display:none; padding:15px; width:100%; max-width: 450px; margin:0 auto; padding-bottom: 100px; position: relative; z-index: 1; }
        .page.active { display:block; }

        /* КАРТОЧКИ С ГЛАСС-ЭФФЕКТОМ */
        .card { background: rgba(255,255,255,0.05); border: 1px solid rgba(0,255,229,0.2); border-radius: 20px; padding: 20px; margin-bottom: 15px; backdrop-filter: blur(12px); position: relative; overflow: hidden; transition: 0.3s; }
        .card:hover { border-color: var(--n); box-shadow: 0 0 20px rgba(0,255,229,0.1); }

        .buy-btn { width:100%; padding:15px; border-radius:12px; border:none; background: linear-gradient(45deg, var(--p), var(--n)); color:#fff; font-weight:900; cursor:pointer; font-family:'Orbitron'; font-size: 11px; text-transform: uppercase; box-shadow: 0 4px 15px rgba(255,0,255,0.3); transition: transform 0.1s; }
        .buy-btn:active { transform: scale(0.96); }

        /* ID-CARD 3D */
        .id-card { background: linear-gradient(135deg, rgba(255,255,255,0.1), rgba(0,0,0,0.5)); border: 1px solid var(--n); border-radius: 20px; padding: 25px; position: relative; transform-style: preserve-3d; transition: transform 0.1s; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .level-bar { width: 100%; height: 4px; background: #222; border-radius: 2px; margin: 10px 0; overflow: hidden; }
        .level-progress { height: 100%; background: var(--n); width: 35%; box-shadow: 0 0 10px var(--n); }

        .scanner-log { font-family: 'JetBrains Mono', monospace; font-size: 9px; color: var(--neon-g); margin-top: 15px; height: 50px; overflow: hidden; opacity: 0.7; }

        /* PANIC BUTTON / KEEPER */
        .keeper-btn { background: #ff0000; color: white; padding: 15px; border-radius: 12px; border: 2px solid white; font-family: 'Orbitron'; font-weight: 900; cursor: pointer; width: 100%; margin-top: 10px; animation: pulse-red 2s infinite; }
        @keyframes pulse-red { 0% { box-shadow: 0 0 0 0 rgba(255,0,0,0.7); } 70% { box-shadow: 0 0 0 15px rgba(255,0,0,0); } 100% { box-shadow: 0 0 0 0 rgba(255,0,0,0); } }

        .status-badge { display: inline-block; padding: 4px 10px; border-radius: 6px; font-size: 10px; font-weight: bold; margin-top: 5px; }
        .status-active { background: rgba(0,255,65,0.2); color: var(--neon-g); border: 1px solid var(--neon-g); box-shadow: 0 0 10px var(--neon-g); }

        .adm-card { background: rgba(0,0,0,0.8); border: 1px solid #444; padding: 15px; border-radius: 15px; margin-bottom: 10px; font-size: 11px; border-left: 4px solid var(--p); }
        .adm-btn-ok { background: var(--neon-g); color: #000; border:none; padding: 8px 15px; border-radius: 8px; font-weight: bold; cursor: pointer; }

        .toast { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); background: rgba(0,255,229,0.9); color: #000; padding: 12px 25px; border-radius: 50px; font-family: 'Orbitron'; font-weight: 900; font-size: 12px; z-index: 10000; display: none; box-shadow: 0 0 20px var(--n); }
    </style>
</head>
<body>

<div id="boot-screen"></div>
<canvas id="bg-canvas"></canvas>

<div class="header">
    <div class="neon-title" id="main-title" onclick="handleConsoleTap()">MOZGALOM ELITE</div>
</div>

<div class="nav">
    <button id="n-shop" onclick="show('shop')" class="active">МАРКЕТ</button>
    <button id="n-cases" onclick="show('cases')">КЕЙСЫ</button>
    <button id="n-history" onclick="show('history')">ЗАКАЗЫ</button>
    <button id="n-auth" onclick="show('auth')">ПРОФИЛЬ</button>
    <button id="n-admin" onclick="show('admin')" style="color:var(--p); border-color:var(--p)">ADM</button>
</div>

<div id="shop" class="page active">
    <div id="bridge-map"></div>
    <div id="promo-box" style="display:none" class="card">
        <h4 style="margin:0; color:var(--n)">HACKER CONSOLE</h4>
        <input id="promo_input" type="text" placeholder="CODE..." style="width:100%; padding:10px; margin:10px 0; background:#000; border:1px solid var(--n); color:#fff;">
        <button class="buy-btn" onclick="applyPromo()">ACTIVATE</button>
    </div>
    
    <div class="card">
        <h3 style="color: var(--sakura); margin-top:0;">1 НЕДЕЛЯ (PRO)</h3>
        <div style="font-size:26px; font-weight:900; color:var(--n); font-family:Orbitron;">300₽</div>
        <div style="font-size:12px; color:var(--sakura); margin-bottom:15px;">4$ | 2 💎</div>
        <button class="buy-btn" onclick="buy('1 НЕДЕЛЯ PRO', 300, 7)">КУПИТЬ ТАРИФ</button>
    </div>

    <div class="card">
        <h3 style="color: var(--sakura); margin-top:0;">1 МЕСЯЦ (ULTRA)</h3>
        <div style="font-size:26px; font-weight:900; color:var(--n); font-family:Orbitron;">1000₽</div>
        <div style="font-size:12px; color:var(--sakura); margin-bottom:15px;">13$ | 6 💎</div>
        <button class="buy-btn" onclick="buy('1 МЕСЯЦ ULTRA', 1000, 30)">КУПИТЬ ТАРИФ</button>
    </div>

    <div class="card">
        <h3 style="color: var(--sakura); margin-top:0;">FOREVER (LEGEND)</h3>
        <div style="font-size:26px; font-weight:900; color:var(--n); font-family:Orbitron;">4000₽</div>
        <div style="font-size:12px; color:var(--sakura); margin-bottom:15px;">52$ | 25 💎</div>
        <button class="buy-btn" onclick="buy('LEGEND', 4000, 99999)">СТАТЬ ЛЕГЕНДОЙ</button>
    </div>
</div>

<div id="cases" class="page">
    <div class="card" style="text-align:center;">
        <h2 style="font-family:Orbitron; margin:0;">LUCKY SLOT</h2>
        <div id="spins_display" style="color:var(--n); font-size:18px; margin:10px 0;">КРУТОК: 0</div>
        <div style="height:80px; border:2px solid var(--sakura); position:relative; overflow:hidden; background:#000; border-radius:15px; margin:15px 0;">
            <div id="tape" style="display:flex; align-items:center; position:absolute; left:0; height:100%; transition: 5s cubic-bezier(0.1, 0, 0.1, 1);"></div>
            <div style="position:absolute; left:50%; top:0; width:2px; height:100%; background:var(--n); z-index:5;"></div>
        </div>
        <button id="spin_trigger" class="buy-btn" style="display:none; margin-bottom:10px;" onclick="startSpin()">ЗАПУСТИТЬ ВЗЛОМ</button>
        <button id="hack_btn" class="buy-btn" style="background:transparent; border:1px solid #ff4444; color:#ff4444;" onclick="startHackerGame()">HACK FREE SPIN</button>
    </div>
</div>

<div id="hacker-game" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.95); z-index:2000; flex-direction:column; align-items:center; justify-content:center;">
    <h2 style="color:var(--n); font-family:Orbitron;">OVERRIDE SYSTEM</h2>
    <div id="hack-area" style="position:relative; width:100%; height:300px;"></div>
</div>

<div id="history" class="page">
    <div class="card">
        <h4 style="color:var(--n)">ОПЛАТА TON / КАРТА</h4>
        <code id="w-addr" onclick="copyW()" style="font-size:10px; color:#aaa; word-break:break-all;">UQAYHaet-WWovXy7HoH84ud8cz_VjENJAmuEySnVe9aiw2Dv</code>
    </div>
    <div id="h_list">Загрузка...</div>
</div>

<div id="auth" class="page">
    <div id="uProfile" style="display:none;">
        <div class="id-card" id="main-id-card">
            <div id="uRank" style="font-size:10px; color:var(--gold); font-family:Orbitron;">ROOKIE</div>
            <h2 id="uEmail" style="font-family:Orbitron; margin:10px 0;">...</h2>
            <div class="level-bar"><div class="level-progress"></div></div>
            <div id="uGlobalStatus"></div>
            <div class="scanner-log" id="scanner-log"></div>
        </div>
        <button class="keeper-btn" onclick="activateKeeper()">ACTIVATE KEEPER</button>
        <button onclick="auth.signOut().then(()=>location.reload())" style="background:none; border:1px solid red; color:red; width:100%; padding:10px; margin-top:20px; border-radius:10px; font-weight:bold;">DISCONNECT</button>
    </div>
    <div id="loginCard" class="card">
        <input id="u_nick" type="text" placeholder="LOGIN" style="width:100%; padding:14px; margin-bottom:10px; background:#000; border:1px solid var(--p); color:#fff; border-radius:10px;">
        <input id="u_pass" type="password" placeholder="PASSWORD" style="width:100%; padding:14px; margin-bottom:10px; background:#000; border:1px solid var(--p); color:#fff; border-radius:10px;">
        <button class="buy-btn" onclick="doLogin()">AUTHORIZE</button>
    </div>
</div>

<div id="admin" class="page">
    <div id="adm_login_box" class="card">
        <input id="a_pass" type="password" placeholder="Admin Key" style="width:100%; padding:14px; background:#000; border:1px solid var(--p); color:#fff; border-radius:10px;">
        <button class="buy-btn" style="margin-top:10px;" onclick="goAdmin()">ACCESS TERMINAL</button>
    </div>
    <div id="a_panel" style="display:none;">
        <button class="buy-btn" style="background: #ff4444; margin-bottom:15px;" onclick="wipeExpired()">WIPE EXPIRED</button>
        <div id="a_orders"></div>
    </div>
</div>

<div class="toast" id="toast">SYSTEM PROTECTED</div>

<script>
// CONFIG
const firebaseConfig = { apiKey: "AIzaSyD94vjwnRQIYC-2Le_nmxtsVKlU6Oww6VE", authDomain: "mozgalom-site.firebaseapp.com", projectId: "mozgalom-site", storageBucket: "mozgalom-site.appspot.com", appId: "1:564649897907:web:61503121e661fb6a82a5c6" };
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

// BOOT SCREEN & AUDIO
const bootLines = ["> INITIALIZING MOZGALOM...", "> LOADING NEON_OS v3.0...", "> STABILIZING BRIDGE MAP...", "> ACCESS GRANTED."];
let bL = 0;
function typeB() {
    if(bL < bootLines.length) {
        let d = document.createElement('div'); d.innerText = bootLines[bL++];
        document.getElementById('boot-screen').appendChild(d);
        setTimeout(typeB, 400);
    } else { 
        setTimeout(() => { 
            document.getElementById('boot-screen').style.display='none';
            new Audio('https://www.soundjay.com/buttons/sounds/button-20.mp3').play().catch(()=>{}); 
        }, 600); 
    }
}
typeB();

// BRIDGE MAP PINGS
function spawnPing() {
    const map = document.getElementById('bridge-map');
    if(!map) return;
    const ping = document.createElement('div');
    ping.className = 'attack-ping';
    ping.style.left = Math.random()*100 + "%";
    ping.style.top = Math.random()*100 + "%";
    map.appendChild(ping);
    setTimeout(() => ping.remove(), 2000);
}
setInterval(spawnPing, 800);

// SCANNER LOG
const logEntries = ["SCANNING IP...", "DB LEAK CHECK...", "ENCRYPTING...", "PROXY: ACTIVE", "PORT 443: SECURE"];
function updateLog() {
    const log = document.getElementById('scanner-log');
    if(!log) return;
    const line = document.createElement('div');
    line.innerText = `> ${logEntries[Math.floor(Math.random()*logEntries.length)]}`;
    log.prepend(line);
    if(log.childNodes.length > 5) log.lastChild.remove();
}
setInterval(updateLog, 1500);

// CORE FUNCTIONS
function showToast(m) { let t = document.getElementById('toast'); t.innerText = m; t.style.display='block'; setTimeout(()=>t.style.display='none', 3000); }

function activateKeeper() {
    showToast("KEEPER ACTIVATED");
    document.getElementById('uGlobalStatus').innerHTML = `<div class="status-badge status-active">KEEPER: PROTECTING</div>`;
    new Audio('https://www.soundjay.com/communication/sounds/digital-beeping-2.mp3').play().catch(()=>{});
}

function buy(name, price, days) {
    if(!auth.currentUser) return show('auth');
    const orderId = "MZ" + Math.random().toString(36).substr(2,4).toUpperCase();
    db.collection("orders").add({
        uid: auth.currentUser.uid, email: auth.currentUser.email,
        product: name, price: price, code: orderId,
        status: "pending", timestamp: Date.now(),
        duration_days: days, expire_str: "", expire_at: 0
    }).then(() => { show('history'); showToast("ORDER CREATED"); });
}

function confirmOrder(docId, days, uid) {
    let exp = "БЕССРОЧНО", expT = 9999999999999;
    if(days > 0 && days < 50000) {
        let d = new Date(); d.setDate(d.getDate() + days); 
        exp = d.toLocaleDateString(); expT = d.getTime();
    }
    db.collection('orders').doc(docId).update({ status: 'paid', expire_str: exp, expire_at: expT }).then(() => {
        if(days === 0) db.collection('users').doc(uid).set({ spins: firebase.firestore.FieldValue.increment(1) }, {merge:true});
    });
}

// ADMIN
function goAdmin() {
    if(document.getElementById("a_pass").value === "rahim_45_pro") {
        document.getElementById("adm_login_box").style.display = "none";
        document.getElementById("a_panel").style.display = "block";
        db.collection("orders").orderBy("timestamp", "desc").onSnapshot(s => {
            document.getElementById("a_orders").innerHTML = s.docs.map(d => {
                const data = d.data();
                return `<div class="adm-card">
                    <b>${data.product}</b> | ${data.email.split('@')[0]}<br>
                    <span>ID: ${data.code} | EXP: ${data.expire_str || 'WAIT'}</span><br>
                    ${data.status !== 'paid' ? `<button class="adm-btn-ok" onclick="confirmOrder('${d.id}', ${data.duration_days}, '${data.uid}')">OK</button>` : ''}
                    <button style="background:red; color:white; border:none; padding:5px; margin-left:5px;" onclick="db.collection('orders').doc('${d.id}').delete()">DEL</button>
                </div>`;
            }).join("");
        });
    }
}

async function wipeExpired() {
    const q = await db.collection("orders").where("expire_at", "<", Date.now()).where("expire_at", ">", 0).get();
    q.forEach(doc => doc.ref.delete());
    alert("WIPED");
}

// AUTH & UI
auth.onAuthStateChanged(u => {
    if(u) {
        document.getElementById('loginCard').style.display = 'none';
        document.getElementById('uProfile').style.display = 'block';
        document.getElementById('uEmail').innerText = u.email.split('@')[0].toUpperCase();
        
        let card = document.getElementById('main-id-card');
        card.addEventListener('mousemove', e => {
            let {x, y, width, height} = card.getBoundingClientRect();
            let rx = (e.clientX - x - width / 2) / 10, ry = -(e.clientY - y - height / 2) / 10;
            card.style.transform = `rotateY(${rx}deg) rotateX(${ry}deg)`;
        });

        db.collection('users').doc(u.uid).onSnapshot(doc => {
            let s = doc.data()?.spins || 0;
            document.getElementById('spins_display').innerText = `КРУТОК: ${s}`;
            document.getElementById('spin_trigger').style.display = s > 0 ? 'inline-block' : 'none';
        });

        db.collection("orders").where("uid","==",u.uid).onSnapshot(s => {
            document.getElementById("h_list").innerHTML = s.docs.map(d => `<div class="card" style="border-left:4px solid var(--p)">${d.data().product}<br><small>ДО: ${d.data().expire_str || 'ОЖИДАНИЕ'}</small></div>`).join("");
        });
    }
});

function show(id) {
    document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
    document.querySelectorAll('.nav button').forEach(b=>b.classList.remove('active'));
    document.getElementById(id).classList.add('active');
    document.getElementById('n-'+id).classList.add('active');
}

function doLogin() {
    let n = document.getElementById('u_nick').value.trim().toLowerCase(), p = document.getElementById('u_pass').value;
    auth.signInWithEmailAndPassword(n+"@moz.me", p).catch(() => auth.createUserWithEmailAndPassword(n+"@moz.me", p));
}

// BACKGROUND SAKURA/MATRIX
const canvas = document.getElementById('bg-canvas'), ctx = canvas.getContext('2d');
canvas.width = window.innerWidth; canvas.height = window.innerHeight;
const drops = Array(Math.floor(canvas.width / 20)).fill(0);
function draw() {
    ctx.fillStyle = 'rgba(5, 7, 13, 0.15)'; ctx.fillRect(0,0,canvas.width,canvas.height);
    ctx.fillStyle = '#00ffe5'; ctx.font = "15px monospace";
    drops.forEach((y, i) => { ctx.fillText(Math.floor(Math.random()*2), i*20, y); if(y > canvas.height && Math.random()>0.975) drops[i]=0; else drops[i]+=20; });
}
setInterval(draw, 60);

function copyW() { navigator.clipboard.writeText("UQAYHaet-WWovXy7HoH84ud8cz_VjENJAmuEySnVe9aiw2Dv"); showToast("COPIED"); }
let tCount = 0; function handleConsoleTap() { tCount++; if(tCount>=5) { document.getElementById('promo-box').style.display='block'; tCount=0; } }
</script>
</body>
</html>
