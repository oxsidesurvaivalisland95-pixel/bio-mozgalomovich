<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ULTRA SYSTEM</title>

<style>
html,body{
margin:0;
padding:0;
width:100%;
height:100%;
background:#050508;
font-family:Arial;
color:white;
overflow-x:hidden;
}

*{box-sizing:border-box}

/* фон */
body::before{
content:"";
position:fixed;
inset:0;
background:
radial-gradient(circle at 15% 20%, rgba(0,255,200,0.12), transparent 40%),
radial-gradient(circle at 80% 80%, rgba(95,156,255,0.12), transparent 45%),
radial-gradient(circle at 50% 50%, rgba(255,0,255,0.06), transparent 60%);
pointer-events:none;
z-index:0;
}

/* ❄ снег */
.snow{
position:fixed;
top:-10px;
color:white;
opacity:0.6;
animation:fall linear infinite;
pointer-events:none;
z-index:1;
}

@keyframes fall{
to{transform:translateY(110vh);}
}

/* страницы */
.page{
display:none;
padding:20px;
position:relative;
z-index:2;
}

.page.active{
display:block;
}

/* карточки */
.card{
background:#111118;
max-width:340px;
margin:15px auto;
padding:20px;
border-radius:14px;
border:1px solid rgba(0,255,200,0.2);
}

/* товары кликабельные */
.product{
cursor:pointer;
transition:0.3s;
}

.product:hover{
transform:translateY(-6px) scale(1.03);
box-shadow:0 0 25px rgba(0,255,200,0.4);
}

/* НЕОН ОПЛАТА */
.payGlow{
animation:glow 1.2s ease-in-out infinite alternate;
box-shadow:0 0 20px #00ffcc;
}

@keyframes glow{
from{box-shadow:0 0 10px #00ffcc;}
to{box-shadow:0 0 40px #5f9cff;}
}

/* INPUT FIX (ГЛАВНАЯ ПРОБЛЕМА БЫЛА ТУТ) */
input{
width:90%;
padding:10px;
border-radius:10px;
border:none;
margin-top:10px;
position:relative;
z-index:9999;
pointer-events:auto;
}

/* BUTTON */
button{
width:100%;
padding:12px;
margin-top:10px;
border:none;
border-radius:10px;
background:linear-gradient(90deg,#00ffcc,#5f9cff);
cursor:pointer;
}

/* title */
h1{
text-align:center;
font-size:42px;
background:linear-gradient(90deg,#00ffcc,#5f9cff,#ff00ff);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
}

/* admin */
.adminBtn{
position:fixed;
top:10px;
right:10px;
z-index:10;
font-size:12px;
cursor:pointer;
}
</style>
</head>

<body>

<div class="adminBtn" onclick="show('login')">admin</div>

<h1>ULTRA SYSTEM</h1>

<!-- HOME -->
<div id="home" class="page active">

<!-- РЕГИСТРАЦИЯ ВЕРНУТА -->
<div class="card">
<h3>🔐 аккаунт</h3>

<div id="guest">
<input id="regName" placeholder="имя">
<input id="regPass" type="password" placeholder="пароль">

<button onclick="register()">регистрация</button>
<button onclick="loginUser()">вход</button>
</div>

<div id="userBox" style="display:none">
<p>👤 <span id="userName"></span></p>
<button onclick="logoutUser()">выйти</button>
</div>

</div>

<!-- ТОВАРЫ -->
<div class="card product" onclick="openPay('1 неделя','300₽ / 4$ / 2💎')">
<h3>1 неделя</h3>
<p>300₽ / 4$ / 2💎</p>
</div>

<div class="card product" onclick="openPay('1 месяц','1000₽ / 13$ / 6💎')">
<h3>1 месяц</h3>
<p>1000₽ / 13$ / 6💎</p>
</div>

<div class="card product" onclick="openPay('навсегда','4000₽ / 52$ / 25💎')">
<h3>навсегда</h3>
<p>4000₽ / 52$ / 25💎</p>
</div>

<div class="card">
<h3>📩 заявка</h3>
<input id="tg" placeholder="@telegram">
<button onclick="send()">отправить</button>
</div>

</div>

<!-- PAY -->
<div id="pay" class="page">
<div class="card payGlow">

<h2 id="payTitle" style="text-align:center"></h2>
<p id="payPrice" style="text-align:center"></p>

<p style="text-align:center">
UQAYHaet-WWovXy7HoH84ud8cz_VjENJAmuEySnVe9aiw2Dv
</p>

<button onclick="show('home')">назад</button>

</div>
</div>

<!-- LOGIN -->
<div id="login" class="page">
<div class="card">
<h3>LOGIN</h3>
<input id="pass" type="password">
<button onclick="login()">войти</button>
</div>
</div>

<!-- ADMIN -->
<div id="admin" class="page">
<div class="card">
<h3>ADMIN</h3>
<button onclick="show('home')">выйти</button>
</div>
</div>

<script>

const BOT_TOKEN="PUT_TOKEN_HERE";
const CHAT_ID="7910835075";

/* страницы */
function show(id){
document.querySelectorAll(".page").forEach(p=>{
p.classList.remove("active");
});
document.getElementById(id).classList.add("active");
}

/* ОПЛАТА */
function openPay(title,price){
document.getElementById("payTitle").innerText=title;
document.getElementById("payPrice").innerText=price;
show("pay");
}

/* TELEGRAM */
function send(){
let tg=document.getElementById("tg").value;
if(!tg)return;

fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`,{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({
chat_id:CHAT_ID,
text:`📩 ${tg}`
})
});

alert("отправлено ✔");
}

/* AUTH */
function register(){
let n=document.getElementById("regName").value;
let p=document.getElementById("regPass").value;
localStorage.setItem("user",JSON.stringify({n,p}));
showUser();
}

function loginUser(){
let u=JSON.parse(localStorage.getItem("user"));
let n=document.getElementById("regName").value;
let p=document.getElementById("regPass").value;

if(u && u.n===n && u.p===p){
showUser();
}else alert("неверно");
}

function showUser(){
let u=JSON.parse(localStorage.getItem("user"));
document.getElementById("guest").style.display="none";
document.getElementById("userBox").style.display="block";
document.getElementById("userName").innerText=u.n;
}

function logoutUser(){
localStorage.removeItem("user");
document.getElementById("guest").style.display="block";
document.getElementById("userBox").style.display="none";
}

/* ADMIN */
function login(){
if(document.getElementById("pass").value==="rahim_45_pro"){
show("admin");
}
}

/* ❄ снег */
for(let i=0;i<60;i++){
let d=document.createElement("div");
d.className="snow";
d.innerHTML="•";
d.style.left=Math.random()*100+"vw";
d.style.animationDuration=(3+Math.random()*6)+"s";
document.body.appendChild(d);
}

</script>

</body>
</html>
