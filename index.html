<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ULTRA SYSTEM</title>

<style>
html,body{
margin:0;
padding:0;
width:100%;
height:100%;
background:#050508;
font-family:Arial;
color:white;
overflow-x:hidden;
}

*{box-sizing:border-box}

/* фон */
body::before{
content:"";
position:fixed;
inset:0;
background:
radial-gradient(circle at 15% 20%, rgba(0,255,200,0.12), transparent 40%),
radial-gradient(circle at 80% 80%, rgba(95,156,255,0.12), transparent 45%),
radial-gradient(circle at 50% 50%, rgba(255,0,255,0.06), transparent 60%);
pointer-events:none;
z-index:0;
}

/* ❄ снег */
#snowCanvas{
position:fixed;
inset:0;
width:100%;
height:100%;
pointer-events:none;
z-index:1;
}

.page{
display:none;
padding:20px;
position:relative;
z-index:2;
}
.page.active{display:block}

.card{
background:#111118;
max-width:360px;
margin:15px auto;
padding:20px;
border-radius:14px;
border:1px solid rgba(0,255,200,0.2);
}

.card.product{
cursor:pointer;
transition:0.3s;
}

.card.product:hover{
transform:scale(1.03);
box-shadow:0 0 25px rgba(0,255,200,0.4);
}

input{
width:100%;
padding:10px;
margin-top:10px;
border-radius:10px;
border:none;
}

button{
width:100%;
padding:12px;
margin-top:10px;
border:none;
border-radius:10px;
background:linear-gradient(90deg,#00ffcc,#5f9cff);
cursor:pointer;
}

button:hover{
box-shadow:0 0 20px #00ffcc;
}

h1{
text-align:center;
font-size:40px;
background:linear-gradient(90deg,#00ffcc,#5f9cff,#ff00ff);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
}

.copyBtn{
background:#222;
border:1px solid #00ffcc;
}

.adminBtn{
position:fixed;
top:10px;
right:10px;
font-size:12px;
cursor:pointer;
z-index:10;
}

/* toast */
#copyToast{
position:fixed;
bottom:30px;
left:50%;
transform:translateX(-50%);
background:rgba(0,255,200,0.15);
border:1px solid #00ffcc;
color:white;
padding:10px 20px;
border-radius:12px;
opacity:0;
transition:0.3s;
z-index:9999;
}
</style>
</head>

<body>

<canvas id="snowCanvas"></canvas>
<div id="copyToast">скопировано ✔</div>

<div class="adminBtn" onclick="show('login')">admin</div>

<h1>ULTRA SYSTEM</h1>

<!-- HOME -->
<div id="home" class="page active">

<div class="card">
<h3>🔐 аккаунт</h3>
<input id="regName" placeholder="имя">
<input id="regPass" type="password" placeholder="пароль">
<button onclick="register()">регистрация</button>
<button onclick="loginUser()">вход</button>

<div id="userBox" style="display:none">
<p>👤 <span id="userName"></span></p>
<button onclick="logoutUser()">выйти</button>
</div>
</div>

<div class="card product" onclick="openPay('1 неделя','300₽ / 4$ / 2💎')">
<h3>1 неделя</h3><p>300₽ / 4$ / 2💎</p>
</div>

<div class="card product" onclick="openPay('1 месяц','1000₽ / 13$ / 6💎')">
<h3>1 месяц</h3><p>1000₽ / 13$ / 6💎</p>
</div>

<div class="card product" onclick="openPay('навсегда','4000₽ / 52$ / 25💎')">
<h3>навсегда</h3><p>4000₽ / 52$ / 25💎</p>
</div>

<div class="card">
<h3>📩 заявка</h3>
<input id="tg" placeholder="@telegram">
<button onclick="send()">отправить</button>
</div>

</div>

<!-- PAY -->
<div id="pay" class="page">
<div class="card">

<h2 id="payTitle"></h2>
<p id="payPrice"></p>

<p id="wallet">
UQAYHaet-WWovXy7HoH84ud8cz_VjENJAmuEySnVe9aiw2Dv
</p>

<button onclick="openTonkeeper()">💎 открыть Tonkeeper</button>
<button class="copyBtn" onclick="copyWallet()">копировать</button>
<button onclick="show('home')">назад</button>

</div>
</div>

<!-- LOGIN -->
<div id="login" class="page">
<div class="card">
<h3>LOGIN</h3>
<input id="pass" type="password">
<button onclick="login()">войти</button>
</div>
</div>

<!-- ADMIN -->
<div id="admin" class="page">
<div class="card">
<h3>ADMIN</h3>
<button onclick="show('home')">выйти</button>
</div>
</div>

<script>

const BOT_TOKEN="PUT_TOKEN_HERE";
const CHAT_ID="7910835075";
const WALLET="UQAYHaet-WWovXy7HoH84ud8cz_VjENJAmuEySnVe9aiw2Dv";

/* страницы */
function show(id){
document.querySelectorAll(".page").forEach(p=>p.classList.remove("active"));
document.getElementById(id).classList.add("active");
}

/* pay */
function openPay(t,p){
document.getElementById("payTitle").innerText=t;
document.getElementById("payPrice").innerText=p;
show("pay");
}

/* Tonkeeper */
function openTonkeeper(){
window.location.href=`tonkeeper://transfer/${WALLET}`;
setTimeout(()=>{
window.open(`https://app.tonkeeper.com/transfer/${WALLET}`,"_blank");
},800);
}

/* copy */
function copyWallet(){
navigator.clipboard.writeText(WALLET);

let t=document.getElementById("copyToast");
t.style.opacity="1";
setTimeout(()=>t.style.opacity="0",1200);
}

/* telegram */
function send(){
let tg=document.getElementById("tg").value;
if(!tg)return;

fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`,{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({
chat_id:CHAT_ID,
text:`📩 ${tg}`
})
});
}

/* auth */
function register(){
let n=document.getElementById("regName").value;
let p=document.getElementById("regPass").value;
localStorage.setItem("user",JSON.stringify({n,p}));
showUser();
}

function loginUser(){
let u=JSON.parse(localStorage.getItem("user"));
let n=document.getElementById("regName").value;
let p=document.getElementById("regPass").value;

if(u && u.n===n && u.p===p) showUser();
else alert("неверно");
}

function showUser(){
let u=JSON.parse(localStorage.getItem("user"));
document.getElementById("userBox").style.display="block";
document.getElementById("userName").innerText=u.n;
}

function logoutUser(){
localStorage.removeItem("user");
document.getElementById("userBox").style.display="none";
}

/* admin */
function login(){
if(document.getElementById("pass").value==="rahim_45_pro"){
show("admin");
}
}

/* snow */
const canvas=document.getElementById("snowCanvas");
const ctx=canvas.getContext("2d");

function resize(){
canvas.width=window.innerWidth;
canvas.height=window.innerHeight;
}
resize();
window.addEventListener("resize",resize);

let snow=[];
for(let i=0;i<70;i++){
snow.push({x:Math.random()*canvas.width,y:Math.random()*canvas.height,r:Math.random()*2+1,d:Math.random()*1+0.5});
}

function draw(){
ctx.clearRect(0,0,canvas.width,canvas.height);
ctx.fillStyle="white";
for(let s of snow){
ctx.beginPath();
ctx.arc(s.x,s.y,s.r,0,Math.PI*2);
ctx.fill();
s.y+=s.d;
s.x+=Math.sin(s.y*0.01);
if(s.y>canvas.height){s.y=0;s.x=Math.random()*canvas.width;}
}
requestAnimationFrame(draw);
}
draw();

</script>

</body>
</html>
