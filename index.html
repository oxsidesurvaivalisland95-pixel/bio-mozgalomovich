<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MOZGALOM ELITE 10</title>

    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;900&family=Montserrat:wght@400;700&display=swap" rel="stylesheet">

    <style>
        :root { --n: #00ffe5; --p: #ff00ff; --bg: #05070d; }
        body { margin:0; font-family: 'Montserrat', sans-serif; background: var(--bg); color: #fff; overflow-x: hidden; }
        
        /* КРАСНАЯ ПОЛОСКА (Live Ticker) */
        .live-ticker { background: rgba(255, 0, 0, 0.8); color: white; padding: 5px; text-align: center; font-size: 10px; font-weight: bold; text-transform: uppercase; border-bottom: 1px solid #ff4444; box-shadow: 0 0 15px rgba(255,0,0,0.5); }

        #bg-canvas { position: fixed; top: 0; left: 0; z-index: -1; opacity: 0.3; }
        .header { text-align:center; padding:25px; border-bottom: 2px solid var(--n); background: rgba(0,0,0,0.8); }
        .neon-title { font-family: 'Orbitron'; font-size: 26px; font-weight: 900; color: var(--n); text-shadow: 0 0 10px var(--n); letter-spacing: 3px; }

        .nav { display:flex; gap:10px; padding:12px; overflow-x:auto; background: #000; sticky; top:0; z-index:1000; border-bottom: 1px solid var(--p); }
        .nav button { flex:0 0 auto; background:transparent; border:1px solid var(--n); padding:10px 18px; border-radius:12px; color:var(--n); font-weight:bold; cursor:pointer; }
        .nav button.active { background: var(--n); color:#000; }

        .page { display:none; padding:15px; max-width: 500px; margin:0 auto; padding-bottom: 100px; }
        .page.active { display:block; }

        .card { background: rgba(255,255,255,0.05); border: 1px solid rgba(0,255,229,0.3); border-radius: 20px; padding: 25px; margin-bottom: 20px; }
        .price-tag { font-size: 34px; font-weight: 900; color: #fff; font-family: 'Orbitron'; text-shadow: 0 0 10px var(--n); }
        
        /* КНОПКА ОТКРЫТЬ (из презентации) */
        .open-btn { width:100%; padding:20px; border-radius:15px; border:none; background: #4a86f7; color:#fff; font-weight:900; cursor:pointer; font-family:'Montserrat'; font-size: 18px; box-shadow: 0 4px 15px rgba(74,134,247,0.4); transition: 0.3s; }
        .open-btn:active { transform: scale(0.98); }

        .buy-btn { width:100%; padding:15px; border-radius:12px; border:none; background: linear-gradient(45deg, var(--n), var(--p)); color:#fff; font-weight:900; cursor:pointer; }

        .order-item { border-left: 5px solid var(--n); margin-bottom: 10px; padding: 15px; background: rgba(255,255,255,0.03); border-radius: 0 15px 15px 0; }
        .status-paid { color: #0f8; font-weight: bold; text-shadow: 0 0 5px #0f8; }

        input { width:100%; padding:15px; margin:10px 0; border-radius:12px; border:1px solid var(--n); background:#000; color:#fff; }
        .footer { background:#000; padding:20px; text-align:center; border-top: 1px solid var(--p); }
        .footer a { color:var(--n); text-decoration:none; font-weight:bold; margin: 0 10px; }
    </style>
</head>
<body>

<div class="live-ticker" id="ticker">🔥 КТО-ТО КУПИЛ ДЕФ НАВСЕГДА! СИСТЕМА АКТИВНА...</div>

<canvas id="bg-canvas"></canvas>

<div class="header">
    <div class="neon-title">MOZGALOM ELITE 10</div>
</div>

<div class="nav">
    <button onclick="show('shop')" class="active">МАГАЗИН</button>
    <button onclick="show('history')">МОИ ЗАКАЗЫ</button>
    <button onclick="show('auth')">ПРОФИЛЬ</button>
</div>

<div id="shop" class="page active">
    <div class="card">
        <h3 style="margin:0">ДЕФЕР: 1 НЕДЕЛЯ</h3>
        <div class="price-tag">300₽</div>
        <button class="open-btn" onclick="buy('ДЕФ 1 НЕДЕЛЯ', 300)">Открыть</button>
    </div>
    <div class="card">
        <h3 style="margin:0">ДЕФЕР: 1 МЕСЯЦ</h3>
        <div class="price-tag">1000₽</div>
        <button class="open-btn" onclick="buy('ДЕФ 1 МЕСЯЦ', 1000)">Открыть</button>
    </div>
    <div class="card">
        <h3 style="margin:0">ДЕФЕР: НАВСЕГДА</h3>
        <div class="price-tag">4000₽</div>
        <button class="open-btn" onclick="buy('ДЕФ НАВСЕГДА', 4000)">Открыть</button>
    </div>
</div>

<div id="history" class="page">
    <div class="card" style="border-color: var(--p);">
        <h3 style="margin:0; color:var(--p)">ОПЛАТА TON</h3>
        <p style="font-size:10px;">Копируй кошелек и кидай TON. **ID заказа в коммент!**</p>
        <code id="w-addr" onclick="copyW()" style="font-size:11px; color:var(--n); cursor:pointer;">UQAYHaet-WWovXy7HoH84ud8cz_VjENJAmuEySnVe9aiw2Dv</code>
    </div>
    <div id="h_list">Загрузка...</div>
</div>

<div id="auth" class="page">
    <div id="uProfile" style="display:none;">
        <div class="card">
            <h3 id="uEmail">...</h3>
            <button class="buy-btn" onclick="auth.signOut().then(()=>location.reload())">ВЫЙТИ</button>
        </div>
    </div>
    <div id="loginCard" class="card">
        <h3>ВХОД</h3>
        <input id="u_mail" type="email" placeholder="Email">
        <input id="u_pass" type="password" placeholder="Пароль">
        <button class="buy-btn" onclick="doLogin()">ВОЙТИ</button>
    </div>
</div>

<div class="footer">
    <a href="https://t.me/bio_mozgalom">КАНАЛ</a>
    <a href="https://t.me/mozgalomovich">АДМИН</a>
</div>

<script>
const API_KEY = "AHNKVNLN4TE6CIIAAAAOTL47DIXMBIMQGWIH32JC36VUSZ2CSTP5SPMUMBNYSUAFANATP4I";
const MY_WALLET = "UQAYHaet-WWovXy7HoH84ud8cz_VjENJAmuEySnVe9aiw2Dv";
const TG_TOKEN = "8538869779:AAGSu2F22Tx0TAtRH2gXPlF4ZNsPVKTt3lw";
const TG_CHAT_ID = "7910835075";

const firebaseConfig = { apiKey: "AIzaSyD94vjwnRQIYC-2Le_nmxtsVKlU6Oww6VE", authDomain: "mozgalom-site.firebaseapp.com", projectId: "mozgalom-site", storageBucket: "mozgalom-site.appspot.com", appId: "1:564649897907:web:61503121e661fb6a82a5c6" };
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

function show(id) {
    document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
    document.getElementById(id).classList.add('active');
}

// АВТО-ПРОВЕРКА TON
async function checkTon() {
    try {
        const res = await fetch(`https://toncenter.com/api/v2/getTransactions?address=${MY_WALLET}&limit=10&api_key=${API_KEY}`);
        const data = await res.json();
        if(!data.ok) return;

        const pending = await db.collection("orders").where("status", "==", "pending").get();
        data.result.forEach(tx => {
            const comment = tx.in_msg.message;
            pending.forEach(doc => {
                if(comment && comment.includes(doc.data().code)) {
                    db.collection("orders").doc(doc.id).update({ status: "paid" });
                }
            });
        });
    } catch(e) {}
}
setInterval(checkTon, 30000);

function buy(name, price) {
    if(!auth.currentUser) return alert("ВОЙДИ В АКК");
    const orderId = "MZ" + Math.random().toString(36).substr(2,4).toUpperCase();
    db.collection("orders").add({
        uid: auth.currentUser.uid, email: auth.currentUser.email,
        product: name, price: price, code: orderId,
        status: "pending", timestamp: Date.now()
    }).then(() => {
        fetch(`https://api.telegram.org/bot${TG_TOKEN}/sendMessage?chat_id=${TG_CHAT_ID}&text=${encodeURIComponent("🛒 ЗАКАЗ: "+orderId+"\n"+name)}`, {mode:'no-cors'});
        alert(`ЗАКАЗ: ${orderId}\nОплати на TON и укажи этот ID в комменте!`);
        show('history');
    });
}

auth.onAuthStateChanged(u => {
    if(u) {
        document.getElementById('loginCard').style.display = 'none';
        document.getElementById('uProfile').style.display = 'block';
        document.getElementById('uEmail').innerText = u.email;
        db.collection("orders").where("uid","==",u.uid).onSnapshot(s => {
            document.getElementById("h_list").innerHTML = s.docs.map(d => `
                <div class="order-item">
                    <b>${d.data().product}</b> [${d.data().code}] <br>
                    Статус: <span class="${d.data().status === 'paid' ? 'status-paid' : ''}">${d.data().status.toUpperCase()}</span>
                </div>
            `).join("");
        });
    }
});

function doLogin() { auth.signInWithEmailAndPassword(document.getElementById("u_mail").value, document.getElementById("u_pass").value); }
function copyW() { navigator.clipboard.writeText(MY_WALLET); alert("КОПИРОВАНО"); }

// MATRIX BG
const canvas = document.getElementById('bg-canvas');
const ctx = canvas.getContext('2d');
canvas.width = window.innerWidth; canvas.height = window.innerHeight;
const columns = Array(Math.floor(canvas.width/20)).fill(0);
function draw() {
    ctx.fillStyle = 'rgba(5, 7, 13, 0.15)'; ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#00ffe5'; ctx.font = '15px monospace';
    columns.forEach((y, i) => {
        ctx.fillText(Math.floor(Math.random()*2), i*20, y);
        if(y > canvas.height && Math.random() > 0.98) columns[i] = 0; else columns[i] += 20;
    });
}
setInterval(draw, 70);

// КРАСНАЯ ПОЛОСКА (Live Updates)
const buyers = ['da***', 'ki***', 'ma***', 're***'];
setInterval(() => {
    document.getElementById('ticker').innerText = `🔥 ЮЗЕР ${buyers[Math.floor(Math.random()*buyers.length)]} КУПИЛ ДЕФ НАВСЕГДА!`;
}, 10000);
</script>
</body>
</html>
