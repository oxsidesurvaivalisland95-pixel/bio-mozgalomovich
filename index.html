<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MOZGALOM MARKET 2.0</title>

    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

    <style>
        :root { --n: #00ffe5; --p: #ff00ff; --bg: #05070d; }
        body { margin:0; font-family: sans-serif; background: var(--bg); color:white; display: flex; flex-direction: column; min-height: 100vh; }
        
        /* Дизайн без обрезаний */
        .header { text-align:center; padding:30px 10px; border-bottom: 1px solid var(--n); }
        .nav { display:flex; justify-content:center; gap:8px; padding:12px; background: rgba(10, 15, 30, 0.9); position:sticky; top:0; z-index:100; border-bottom: 1px solid var(--n); flex-wrap: wrap; }
        
        button { background: linear-gradient(45deg, var(--n), var(--p)); border: none; padding: 10px 15px; border-radius: 8px; color: white; font-weight: bold; cursor: pointer; }
        
        .page { display:none; padding:15px; width: 100%; box-sizing: border-box; }
        .page.active { display:block; }

        .card { background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(0, 255, 229, 0.2); border-radius: 15px; padding: 20px; margin-bottom: 15px; text-align: center; }
        input { width:100%; padding:12px; margin:8px 0; border-radius:8px; border:1px solid #333; background:#000; color:white; box-sizing: border-box; }

        /* Кошелек и Кнопка Tonkeeper */
        .ton-btn { background: #0088cc; color: white; padding: 15px; border-radius: 12px; display: block; text-decoration: none; font-weight: bold; margin-top: 10px; }
        
        /* Футер */
        footer { background: #000; padding: 30px 10px; text-align: center; border-top: 1px solid var(--p); margin-top: auto; }
        .footer-links { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; margin-bottom: 15px; }
        .footer-links a { color: white; text-decoration: none; font-weight: bold; font-size: 12px; padding: 10px 15px; border: 1px solid var(--p); border-radius: 20px; }

        #bg-canvas { position: fixed; top: 0; left: 0; z-index: -1; opacity: 0.1; pointer-events: none; }
    </style>
</head>
<body>

<canvas id="bg-canvas"></canvas>

<div class="header"><h1>MOZGALOM</h1></div>

<div class="nav">
    <button onclick="show('shop')">МАРКЕТ</button>
    <button onclick="show('wallet')">КОШЕЛЕК</button>
    <button onclick="show('auth')">ПРОФИЛЬ</button>
    <button onclick="show('history')">ЗАКАЗЫ</button>
    <button onclick="show('admin')" style="background:none; border:1px solid var(--p); color:var(--p)">АДМИН</button>
</div>

<!-- МАРКЕТ -->
<div id="shop" class="page active">
    <div class="card">
        <h3>1 НЕДЕЛЯ (PRO)</h3>
        <p style="color:var(--n); font-size:22px;">300₽ / 2 TON</p>
        <button onclick="buy('1 НЕДЕЛЯ','300₽')" style="width:100%">ОФОРМИТЬ</button>
    </div>
    <div class="card">
        <h3>1 МЕСЯЦ (ULTRA)</h3>
        <p style="color:var(--n); font-size:22px;">1000₽ / 6 TON</p>
        <button onclick="buy('1 МЕСЯЦ','1000₽')" style="width:100%">ОФОРМИТЬ</button>
    </div>
    <div class="card">
        <h3>НАВСЕГДА (LEGEND)</h3>
        <p style="color:var(--n); font-size:22px;">3500₽ / 20 TON</p>
        <button onclick="buy('НАВСЕГДА','3500₽')" style="width:100%">ОФОРМИТЬ</button>
    </div>
</div>

<!-- КОШЕЛЕК (С КНОПКОЙ TONKEEPER) -->
<div id="wallet" class="page">
    <div class="card">
        <h3>ОПЛАТА ЧЕРЕЗ TON</h3>
        <p>Адрес кошелька (нажми, чтобы скопировать):</p>
        <div style="background:#111; padding:10px; border-radius:5px; cursor:pointer; font-size:12px;" onclick="copyW()">
            <span id="w-addr">UQB1O8Y5I...ТВОЙ_АДРЕС...</span>
        </div>
        
        <a id="tonkeeper-link" href="https://tonkeeper.com/transfer/UQB1O8Y5I...ТВОЙ_АДРЕС..." class="ton-btn">
            💎 ОТКРЫТЬ В TONKEEPER
        </a>
    </div>
</div>

<!-- ПРОФИЛЬ -->
<div id="auth" class="page">
    <div class="card" id="authContent">
        <h3>ВХОД</h3>
        <input id="u_mail" type="email" placeholder="Email"><br>
        <input id="u_pass" type="password" placeholder="Пароль"><br>
        <button onclick="doLogin()" style="width:100%">ВОЙТИ</button>
        <button onclick="loginGoogle()" style="width:100%; margin-top:10px; background:#fff; color:#000;">GOOGLE</button>
    </div>
</div>

<!-- ЗАКАЗЫ -->
<div id="history" class="page">
    <div class="card"><h3>ВАШИ ЗАКАЗЫ</h3><div id="h_list"></div></div>
</div>

<!-- АДМИН-ПАНЕЛЬ (ВЕРНУЛ) -->
<div id="admin" class="page">
    <div class="card">
        <h3>АДМИН-ДОСТУП</h3>
        <input id="a_pass" type="password" placeholder="Пароль админа">
        <button onclick="goAdmin()" style="width:100%">ВОЙТИ В ПАНЕЛЬ</button>
        <div id="a_panel" style="display:none; margin-top:20px; text-align:left;"></div>
    </div>
</div>

<footer>
    <div class="footer-links">
        <a href="https://t.me/bio_mozgalom" target="_blank">✈️ КАНАЛ</a>
        <a href="https://www.tiktok.com/@mozgalomovich" target="_blank">🎵 TIKTOK</a>
        <a href="https://t.me/mozgalomovich" target="_blank" style="border-color:#0f0">💬 АДМИН</a>
    </div>
</footer>

<script>
const TG_TOKEN = "8538869779:AAGSu2F22Tx0TAtRH2gXPlF4ZNsPVKTt3lw";
const TG_CHAT_ID = "7910835075";

const firebaseConfig = {
    apiKey: "AIzaSyD94vjwnRQIYC-2Le_nmxtsVKlU6Oww6VE",
    authDomain: "mozgalom-site.firebaseapp.com",
    projectId: "mozgalom-site",
    storageBucket: "mozgalom-site.appspot.com",
    appId: "1:564649897907:web:61503121e661fb6a82a5c6"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

function show(id) { 
    document.querySelectorAll('.page').forEach(p=>p.classList.remove('active')); 
    document.getElementById(id).classList.add('active'); 
}

function copyW() {
    navigator.clipboard.writeText(document.getElementById('w-addr').innerText);
    alert("Скопировано!");
}

function buy(name, price) {
    if(!auth.currentUser) return alert("Войдите в аккаунт!");
    const promo = prompt("Промокод:");
    let finalP = price;
    if(promo && promo.toLowerCase() === 'fullter2026') {
        finalP = "СО СКИДКОЙ (fullter2026)";
        alert("Промокод активирован!");
    }
    const oid = "MZ-" + Math.random().toString(36).substr(2,6).toUpperCase();
    db.collection("orders").add({
        uid: auth.currentUser.uid, email: auth.currentUser.email,
        product: name, price: finalP, code: oid, status: "pending", time: Date.now()
    }).then(() => {
        fetch(`https://api.telegram.org/bot${TG_TOKEN}/sendMessage?chat_id=${TG_CHAT_ID}&text=${encodeURIComponent("🛒 НОВЫЙ ЗАКАЗ: "+name+"\nЮзер: "+auth.currentUser.email+"\nПромо: "+promo)}`, {mode:'no-cors'});
        alert("Заказ создан! Оплатите в разделе КОШЕЛЕК.");
        show('history');
    });
}

auth.onAuthStateChanged(u => {
    if(u) {
        document.getElementById("authContent").innerHTML = `<h3>АККАУНТ</h3><p>${u.email}</p><button onclick="auth.signOut().then(()=>location.reload())" style="width:100%">ВЫЙТИ</button>`;
        db.collection("orders").where("uid","==",u.uid).onSnapshot(s => {
            document.getElementById("h_list").innerHTML = s.docs.map(d => `<div class="card">${d.data().product} - ${d.data().status=='paid'?'ОПЛАЧЕНО ✅':'ЖДЕМ ОПЛАТЫ'}</div>`).join("");
        });
    }
});

function goAdmin() {
    if(document.getElementById("a_pass").value === "rahim_45_pro") {
        document.getElementById("a_panel").style.display="block";
        db.collection("orders").orderBy("time","desc").onSnapshot(s => {
            document.getElementById("a_panel").innerHTML = s.docs.map(d => `
                <div style="font-size:10px; border-bottom:1px solid #333; margin-bottom:10px;">
                    ${d.data().email} | ${d.data().product} <br>
                    <button onclick="db.collection('orders').doc('${d.id}').update({status:'paid'})">ОК</button>
                    <button onclick="db.collection('orders').doc('${d.id}').delete()" style="background:red">X</button>
                </div>
            `).join("");
        });
    }
}

function doLogin() { auth.signInWithEmailAndPassword(document.getElementById("u_mail").value, document.getElementById("u_pass").value).then(()=>location.reload()); }
function loginGoogle() { auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()).then(()=>location.reload()); }

// Анимация фона
const canvas = document.getElementById('bg-canvas');
const ctx = canvas.getContext('2d');
canvas.width = window.innerWidth; canvas.height = window.innerHeight;
const drops = Array(Math.floor(canvas.width/20)).fill(0);
function draw() {
    ctx.fillStyle = 'rgba(5, 7, 13, 0.1)'; ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#00ffe5'; ctx.font = '15px monospace';
    drops.forEach((y, i) => {
        ctx.fillText(Math.floor(Math.random()*2), i*20, y);
        if(y > canvas.height && Math.random() > 0.975) drops[i] = 0;
        else drops[i] += 20;
    });
}
setInterval(draw, 60);
</script>
</body>
</html>
