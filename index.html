<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CYBER MARKET</title>

<style>

/* BASE */
html,body{
margin:0;
padding:0;
background:#05070d;
font-family:Arial;
color:white;
overflow-x:hidden;
}

body{
background: radial-gradient(circle at top,#0b1220,#05070d 60%,#000);
}

/* SCANLINES */
body::after{
content:"";
position:fixed;
inset:0;
background: repeating-linear-gradient(
to bottom,
rgba(255,255,255,0.03),
rgba(255,255,255,0.03) 1px,
transparent 1px,
transparent 3px
);
opacity:.3;
pointer-events:none;
mix-blend-mode:overlay;
}

/* TOP BAR */
.topBar{
text-align:center;
color:#00ffe5;
font-weight:bold;
padding:10px;
letter-spacing:1px;
text-shadow:0 0 10px #00ffe5;
}

/* TITLE */
.title{
text-align:center;
font-size:40px;
margin:20px;
color:#00ffe5;
text-shadow:0 0 10px #00ffe5,0 0 25px #ff00ff;
animation:glow 2.5s infinite, floatTitle 3s ease-in-out infinite;
}

@keyframes glow{
0%{text-shadow:0 0 5px #00ffe5;}
50%{text-shadow:0 0 25px #ff00ff;}
100%{text-shadow:0 0 5px #00ffe5;}
}

@keyframes floatTitle{
0%{transform:translateY(0px);}
50%{transform:translateY(-5px);}
100%{transform:translateY(0px);}
}

/* NAV */
.nav{
position:fixed;
top:10px;
right:10px;
display:flex;
gap:5px;
z-index:10;
}

/* PAGE */
.page{display:none;padding:70px 15px;}
.page.active{display:block}

/* CARD */
.card{
background:#101826;
padding:15px;
margin:10px auto;
max-width:420px;
border-radius:15px;
border:1px solid #00ffe5;
box-shadow:0 0 15px rgba(0,255,255,0.15);
animation:float 4s ease-in-out infinite, fadeIn .3s ease;
transition:.25s;
}

.card:hover{
transform:scale(1.03);
box-shadow:0 0 30px rgba(255,0,255,0.25);
}

@keyframes float{
0%{transform:translateY(0px);}
50%{transform:translateY(-6px);}
100%{transform:translateY(0px);}
}

@keyframes fadeIn{
from{opacity:0;transform:scale(.95);}
to{opacity:1;transform:scale(1);}
}

/* BUTTON */
button{
width:100%;
padding:10px;
margin-top:8px;
border:none;
border-radius:10px;
background:linear-gradient(90deg,#00ffcc,#5f9cff,#ff00ff);
color:white;
font-weight:bold;
cursor:pointer;
transition:.2s;
}

button:hover{
filter:brightness(1.2);
transform:scale(1.03);
box-shadow:0 0 20px rgba(0,255,255,.4);
}

/* INPUT */
input{
width:100%;
padding:10px;
margin-top:8px;
border-radius:10px;
border:none;
background:#0d1018;
color:white;
}

/* HISTORY */
#history .card{
border-left:3px solid #00ffe5;
padding-left:15px;
}

/* COPY */
.copyToast{
position:fixed;
left:50%;
top:50%;
transform:translate(-50%,-50%);
background:#0d1018;
border:1px solid #00ffe5;
color:#00ffe5;
padding:12px 18px;
border-radius:12px;
z-index:9999;
animation:pop .25s ease;
}

@keyframes pop{
from{opacity:0;transform:translate(-50%,-50%) scale(.8);}
to{opacity:1;transform:translate(-50%,-50%) scale(1);}
}

/* SOCIAL */
.socials a{
color:#00ffe5;
text-decoration:none;
margin:0 10px;
font-weight:bold;
}

.socials a:hover{
text-shadow:0 0 10px #00ffe5;
}

/* BOTTOM */
.bottomBar{
position:fixed;
bottom:0;
width:100%;
text-align:center;
font-size:12px;
padding:6px;
color:#00ffe5;
background:rgba(0,0,0,0.4);
backdrop-filter:blur(6px);
}

/* PARTICLES */
.leaf{
position:fixed;
top:-20px;
width:6px;
height:6px;
background:#00ffe5;
border-radius:50%;
opacity:.6;
animation:fall linear infinite;
}

@keyframes fall{
0%{transform:translateY(-10vh);}
100%{transform:translateY(110vh);}
}

</style>
</head>

<body>

<div class="topBar">@mozgalomovich</div>

<div class="title">CYBER MARKET</div>

<div class="nav">
<button onclick="show('home')">🏠</button>
<button onclick="show('cart')">🛒</button>
<button onclick="show('history')">📜</button>
<button onclick="show('admin')">⚙️</button>
</div>

<!-- HOME -->
<div id="home" class="page active">

<div class="card">
<h3>1 НЕДЕЛЯ</h3>
<div>300₽ / 4$ / 2 TON</div>
<button onclick="add('1 неделя')">добавить</button>
</div>

<div class="card">
<h3>1 МЕСЯЦ</h3>
<div>1000₽ / 13$ / 6 TON</div>
<button onclick="add('1 месяц')">добавить</button>
</div>

<div class="card">
<h3>НАВСЕГДА</h3>
<div>4000₽ / 52$ / 25 TON</div>
<button onclick="add('навсегда')">добавить</button>
</div>

<!-- ACCOUNT -->
<div class="card">
<h3>АККАУНТ</h3>
<input id="login" placeholder="логин">
<input id="pass" placeholder="пароль">
<button onclick="register()">регистрация</button>
<button onclick="login()">вход</button>
</div>

<!-- TON -->
<div class="card">
<h3>TON WALLET</h3>
<div style="font-size:12px;word-break:break-all;opacity:.7">
UQAYHaet-WWovXy7HoH84ud8cz_VjENJAmuEySnVe9aiw2Dv
</div>
<button onclick="copyWallet()">📋 скопировано</button>
<button onclick="window.open('ton://transfer/UQAYHaet-WWovXy7HoH84ud8cz_VjENJAmuEySnVe9aiw2Dv')">
💰 Tonkeeper
</button>
</div>

<!-- SOCIALS -->
<div class="card socials">
<h3>СОЦСЕТИ</h3>
<a href="https://t.me/bio_mozgalom" target="_blank">Telegram</a>
<a href="https://www.tiktok.com/@mozgalomovich?_r=1&_t=ZS-96A3aJHUonR" target="_blank">TikTok</a>
</div>

</div>

<!-- CART -->
<div id="cart" class="page"></div>

<!-- HISTORY -->
<div id="history" class="page"></div>

<!-- ADMIN -->
<div id="admin" class="page">
<div class="card">
<input id="adminPass" placeholder="admin">
<button onclick="adminLogin()">вход</button>
</div>
<div id="adminPanel"></div>
</div>

<div class="bottomBar">CYBER MARKET • MOZGALOM SYSTEM</div>

<script>

let user = localStorage.getItem("user") || "guest";
let cart = [];
let history = [];
let orders = [];
let admin = false;

function load(){
cart = JSON.parse(localStorage.getItem("cart_"+user) || "[]");
history = JSON.parse(localStorage.getItem("history_"+user) || "[]");
}
load();

function show(id){
document.querySelectorAll(".page").forEach(p=>p.classList.remove("active"));
document.getElementById(id).classList.add("active");
render();
}

function register(){
user=document.getElementById("login").value;
localStorage.setItem("user",user);
localStorage.setItem("cart_"+user,"[]");
localStorage.setItem("history_"+user,"[]");
load();
}

function login(){
user=document.getElementById("login").value;
load();
}

function add(i){
cart.push(i);
localStorage.setItem("cart_"+user,JSON.stringify(cart));
}

function order(i){
orders.push({id:Date.now(),item:cart[i],status:"ожидает"});
let h = JSON.parse(localStorage.getItem("history_"+user) || "[]");
h.push(cart[i]);
localStorage.setItem("history_"+user,JSON.stringify(h));
history=h;
}

function adminLogin(){
if(adminPass.value==="rahim_45_pro"){
admin=true;
render();
}
}

function copyWallet(){
navigator.clipboard.writeText("UQAYHaet-WWovXy7HoH84ud8cz_VjENJAmuEySnVe9aiw2Dv");
let d=document.createElement("div");
d.className="copyToast";
d.innerText="скопировано";
document.body.appendChild(d);
setTimeout(()=>d.remove(),1200);
}

function render(){

if(document.getElementById("cart").classList.contains("active")){
let c=document.getElementById("cart");
c.innerHTML="";
cart.forEach((i,idx)=>{
c.innerHTML+=`<div class="card">${i}<button onclick="order(${idx})">заказать</button></div>`;
});
}

if(document.getElementById("history").classList.contains("active")){
let h=document.getElementById("history");
h.innerHTML="";
let data=JSON.parse(localStorage.getItem("history_"+user)||"[]");
if(!data.length){h.innerHTML=`<div class="card">история пуста</div>`;return;}
data.slice().reverse().forEach(i=>{
h.innerHTML+=`<div class="card">transaction<br>${i}</div>`;
});
}

if(admin){
let a=document.getElementById("adminPanel");
a.innerHTML="";
orders.forEach(o=>{
a.innerHTML+=`<div class="card">${o.item}<br>${o.status}</div>`;
});
}

}

/* particles */
for(let i=0;i<25;i++){
let d=document.createElement("div");
d.className="leaf";
d.style.left=Math.random()*100+"vw";
d.style.animationDuration=(3+Math.random()*6)+"s";
document.body.appendChild(d);
}

</script>

</body>
</html>
