<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CYBER MARKET</title>

<style>
html,body{
margin:0;
padding:0;
background:#05070d;
font-family:Arial;
color:white;
overflow-x:hidden;
}

body{
background: radial-gradient(circle at top,#0b1220,#05070d 60%,#000);
}

body::after{
content:"";
position:fixed;
inset:0;
background: repeating-linear-gradient(
to bottom,
rgba(255,255,255,0.03),
rgba(255,255,255,0.03) 1px,
transparent 1px,
transparent 3px
);
opacity:.25;
pointer-events:none;
}

.title{
text-align:center;
font-size:40px;
margin:20px;
color:#00ffe5;
text-shadow:0 0 15px #00ffe5;
}

.nav{
position:fixed;
top:10px;
right:10px;
display:flex;
gap:5px;
}

.page{display:none;padding:70px 15px;}
.page.active{display:block}

.card{
background:#101826;
padding:15px;
margin:10px auto;
max-width:420px;
border-radius:15px;
border:1px solid #00ffe5;
}

button{
width:100%;
padding:10px;
margin-top:8px;
border:none;
border-radius:10px;
background:linear-gradient(90deg,#00ffcc,#5f9cff,#ff00ff);
color:white;
font-weight:bold;
cursor:pointer;
}

input{
width:100%;
padding:10px;
margin-top:8px;
border-radius:10px;
border:none;
background:#0d1018;
color:white;
}

#history .card{
border-left:3px solid #00ffe5;
padding-left:15px;
}

</style>
</head>

<body>

<div class="title">CYBER MARKET</div>

<div class="nav">
<button onclick="show('home')">🏠</button>
<button onclick="show('cart')">🛒</button>
<button onclick="show('history')">📜</button>
<button onclick="show('admin')">⚙️</button>
</div>

<!-- HOME -->
<div id="home" class="page active">

<!-- 🔥 ТАРИФЫ ВЕРНУТЫ -->
<div class="card">
<h3>1 НЕДЕЛЯ</h3>
<div>300₽ / 4$ / 2 TON</div>
<button onclick="add('1 неделя')">добавить</button>
</div>

<div class="card">
<h3>1 МЕСЯЦ</h3>
<div>1000₽ / 13$ / 6 TON</div>
<button onclick="add('1 месяц')">добавить</button>
</div>

<div class="card">
<h3>НАВСЕГДА</h3>
<div>4000₽ / 52$ / 25 TON</div>
<button onclick="add('навсегда')">добавить</button>
</div>

<!-- LOGIN -->
<div class="card">
<h3>АККАУНТ</h3>
<input id="login" placeholder="логин">
<input id="pass" placeholder="пароль">
<button onclick="register()">регистрация</button>
<button onclick="login()">вход</button>
</div>

</div>

<!-- CART -->
<div id="cart" class="page"></div>

<!-- HISTORY -->
<div id="history" class="page"></div>

<!-- ADMIN -->
<div id="admin" class="page">
<div class="card">
<input id="adminPass" placeholder="admin">
<button onclick="adminLogin()">вход</button>
</div>
<div id="adminPanel"></div>
</div>

<script>

let user = localStorage.getItem("user") || "guest";
let cart = [];
let history = [];
let orders = [];
let admin = false;

/* LOAD */
function load(){
cart = JSON.parse(localStorage.getItem("cart_"+user) || "[]");
history = JSON.parse(localStorage.getItem("history_"+user) || "[]");
}
load();

/* NAV */
function show(id){
document.querySelectorAll(".page").forEach(p=>p.classList.remove("active"));
document.getElementById(id).classList.add("active");
render();
}

/* REGISTER */
function register(){
user=document.getElementById("login").value;
localStorage.setItem("user",user);
localStorage.setItem("cart_"+user,"[]");
localStorage.setItem("history_"+user,"[]");
load();
}

/* LOGIN */
function login(){
user=document.getElementById("login").value;
load();
}

/* ADD */
function add(i){
cart.push(i);
localStorage.setItem("cart_"+user,JSON.stringify(cart));
}

/* ORDER + HISTORY FIXED */
function order(i){
orders.push({id:Date.now(),item:cart[i],status:"ожидает"});

let h = JSON.parse(localStorage.getItem("history_"+user) || "[]");
h.push(cart[i]);

localStorage.setItem("history_"+user,JSON.stringify(h));
history = h;
}

/* ADMIN */
function adminLogin(){
if(adminPass.value==="rahim_45_pro"){
admin=true;
render();
}
}

/* RENDER */
function render(){

/* CART */
if(document.getElementById("cart").classList.contains("active")){
let c=document.getElementById("cart");
c.innerHTML="";
cart.forEach((i,idx)=>{
c.innerHTML+=`
<div class="card">
${i}
<button onclick="order(${idx})">заказать</button>
</div>`;
});
}

/* HISTORY FIXED */
if(document.getElementById("history").classList.contains("active")){
let h=document.getElementById("history");
h.innerHTML="";

let data = JSON.parse(localStorage.getItem("history_"+user) || "[]");

if(data.length===0){
h.innerHTML=`<div class="card">история пуста</div>`;
return;
}

data.slice().reverse().forEach(i=>{
h.innerHTML+=`
<div class="card">
transaction<br>${i}
</div>`;
});
}

/* ADMIN */
if(admin){
let a=document.getElementById("adminPanel");
a.innerHTML="";
orders.forEach(o=>{
a.innerHTML+=`
<div class="card">
${o.item}<br>${o.status}
</div>`;
});
}

}

</script>

</body>
</html>
