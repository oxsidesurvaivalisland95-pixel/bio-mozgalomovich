<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ULTRA SYSTEM</title>

<style>
html,body{
margin:0;
padding:0;
width:100%;
height:100%;
background:#050508;
color:white;
font-family:Arial;
overflow-x:hidden;
}

/* 🌌 BACKGROUND */
body::before{
content:"";
position:fixed;
inset:0;
pointer-events:none;
background:
radial-gradient(circle at 15% 20%, rgba(0,255,200,0.12), transparent 40%),
radial-gradient(circle at 80% 80%, rgba(95,156,255,0.12), transparent 45%),
radial-gradient(circle at 50% 50%, rgba(255,0,255,0.06), transparent 60%);
z-index:0;
}

/* TITLE */
h1{
font-size:42px;
text-align:center;
margin-top:15px;
background:linear-gradient(90deg,#00ffcc,#5f9cff,#ff00ff);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
text-shadow:0 0 25px rgba(0,255,200,0.4);
}

/* LAYOUT */
.page{display:none}
.container{padding:20px}

/* CARD */
.card{
position:relative;
z-index:1;
background:#111118;
max-width:340px;
margin:15px auto;
padding:20px;
border-radius:14px;
border:1px solid rgba(0,255,200,0.2);
transition:0.25s ease;
box-shadow:0 0 15px rgba(0,255,200,0.08);
}

.card:hover{
transform:translateY(-6px) scale(1.02);
box-shadow:
0 0 25px rgba(0,255,200,0.35),
0 0 60px rgba(95,156,255,0.2);
}

/* BUTTON */
button{
width:100%;
padding:12px;
margin-top:10px;
border:none;
border-radius:10px;
background:linear-gradient(90deg,#00ffcc,#5f9cff);
font-weight:bold;
cursor:pointer;
transition:0.2s;
box-shadow:0 0 12px rgba(0,255,200,0.25);
}

button:hover{
transform:scale(1.05);
box-shadow:0 0 30px #00ffcc;
}

/* INPUT FIX */
input{
width:90%;
padding:10px;
border-radius:10px;
border:none;
margin-top:10px;
pointer-events:auto;
position:relative;
z-index:10;
}

/* ADMIN */
.adminBtn{
position:fixed;
top:10px;
right:10px;
font-size:11px;
color:#666;
cursor:pointer;
z-index:10;
}

/* SNOW */
.snow{
position:fixed;
top:-10px;
color:white;
animation:fall linear infinite;
opacity:.5;
pointer-events:none;
}

@keyframes fall{
to{transform:translateY(110vh)}
}

</style>
</head>

<body>

<div class="adminBtn" onclick="showLogin()">admin</div>

<h1>ULTRA SYSTEM</h1>

<!-- HOME -->
<div id="home" class="page" style="display:block">
<div class="container">

<!-- 🔐 AUTH -->
<div class="card">
<h3>🔐 аккаунт</h3>

<div id="guest">
<input id="regName" placeholder="имя">
<input id="regPass" type="password" placeholder="пароль">
<button onclick="register()">регистрация</button>
<button onclick="loginUser()">вход</button>
</div>

<div id="userBox" style="display:none">
<p>👤 <span id="userName"></span></p>
<button onclick="logoutUser()">выйти</button>
</div>

</div>

<!-- PRICES -->
<div class="card">
<h3>1 неделя</h3>
<p>300₽ / 4$ / 2💎</p>
<button onclick="openPay()">купить</button>
</div>

<div class="card">
<h3>1 месяц</h3>
<p>1000₽ / 13$ / 6💎</p>
<button onclick="openPay()">купить</button>
</div>

<div class="card">
<h3>навсегда</h3>
<p>4000₽ / 52$ / 25💎</p>
<button onclick="openPay()">купить</button>
</div>

<!-- TELEGRAM -->
<div class="card">
<h3>📩 заявка</h3>
<input id="tg" placeholder="@telegram">
<button onclick="send()">отправить</button>
</div>

</div>
</div>

<!-- PAY -->
<div id="pay" class="page">
<div class="container">

<h2 style="color:#00ffcc;text-align:center">TON оплата</h2>

<img id="qr" width="180" style="display:block;margin:20px auto;border-radius:12px">

<div class="card">
<p id="wallet">EQAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAM9c</p>

<button onclick="copyWallet()">📋 копировать</button>
<button onclick="openWallet()">💎 открыть</button>
</div>

<button onclick="back()">назад</button>

</div>
</div>

<!-- LOGIN -->
<div id="login" class="page">
<div class="container">
<h2>ADMIN LOGIN</h2>
<input id="pass" type="password">
<button onclick="login()">войти</button>
</div>
</div>

<!-- ADMIN -->
<div id="admin" class="page">
<div class="container">
<h2>ADMIN PANEL</h2>
<button onclick="logout()">выйти</button>
</div>
</div>

<script>

const BOT_TOKEN="PUT_TOKEN_HERE";
const CHAT_ID="7910835075";
const TON="EQAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAM9c";

/* QR */
document.addEventListener("DOMContentLoaded",()=>{
document.getElementById("qr").src=
`https://api.qrserver.com/v1/create-qr-code/?size=180x180&data=${TON}`;
});

/* TELEGRAM */
function send(){
let tg=document.getElementById("tg").value;
if(!tg)return;

fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`,{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({
chat_id:CHAT_ID,
text:`📩 ${tg}`
})
});

alert("заявка отправлена ✔");
}

/* TON */
function copyWallet(){
navigator.clipboard.writeText(TON);
alert("copied ✔");
}

function openWallet(){
window.open("https://app.tonkeeper.com/transfer/"+TON);
}

/* NAV */
function openPay(){
home.style.display="none";
pay.style.display="block";
}

function back(){
home.style.display="block";
pay.style.display="none";
}

/* ADMIN */
function login(){
let p=document.getElementById("pass").value;
if(p==="rahim_45_pro"){
home.style.display="none";
login.style.display="none";
admin.style.display="block";
}
}

function logout(){
home.style.display="block";
admin.style.display="none";
login.style.display="none";
}

function showLogin(){
home.style.display="none";
login.style.display="block";
}

/* AUTH */
function register(){
let name=document.getElementById("regName").value;
let pass=document.getElementById("regPass").value;
if(!name||!pass)return;

localStorage.setItem("user",JSON.stringify({name,pass}));
showUser();
}

function loginUser(){
let name=document.getElementById("regName").value;
let pass=document.getElementById("regPass").value;

let u=JSON.parse(localStorage.getItem("user"));

if(u && u.name===name && u.pass===pass){
showUser();
}else alert("неверно");
}

function showUser(){
let u=JSON.parse(localStorage.getItem("user"));
if(!u)return;

document.getElementById("guest").style.display="none";
document.getElementById("userBox").style.display="block";
document.getElementById("userName").innerText=u.name;
}

function logoutUser(){
localStorage.removeItem("user");
document.getElementById("guest").style.display="block";
document.getElementById("userBox").style.display="none";
}

/* SNOW */
for(let i=0;i<60;i++){
let d=document.createElement("div");
d.className="snow";
d.innerHTML="•";
d.style.left=Math.random()*100+"vw";
d.style.animationDuration=(3+Math.random()*6)+"s";
document.body.appendChild(d);
}

</script>

</body>
</html>
