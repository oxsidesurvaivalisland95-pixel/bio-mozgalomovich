
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CYBER MARKET X</title>

<style>

*{margin:0;padding:0;box-sizing:border-box;}

body{
font-family:Arial;
color:white;
min-height:100vh;
overflow-x:hidden;
background:
radial-gradient(circle at top left,#00ffe515,transparent 30%),
radial-gradient(circle at bottom right,#ff00ff12,transparent 30%),
linear-gradient(180deg,#05070d,#060912,#0a1020);
}

/* scan */
body::before{
content:"";
position:fixed;
inset:0;
pointer-events:none;
background:repeating-linear-gradient(
to bottom,
rgba(255,255,255,0.02),
rgba(255,255,255,0.02) 1px,
transparent 3px,
transparent 6px
);
animation:scan 6s linear infinite;
}

@keyframes scan{
0%{transform:translateY(0);}
100%{transform:translateY(10px);}
}

.header{
text-align:center;
padding:20px;
font-size:40px;
font-weight:bold;
color:#00ffe5;
text-shadow:0 0 20px #00ffe5,0 0 40px #ff00ff;
}

.nav{
display:flex;
justify-content:center;
gap:10px;
padding:10px;
background:rgba(0,0,0,0.4);
backdrop-filter:blur(10px);
}

button{
padding:10px;
border:none;
border-radius:10px;
cursor:pointer;
color:white;
background:linear-gradient(90deg,#00ffe5,#ff00ff);
transition:.2s;
}

button:hover{transform:scale(1.05);}

.page{display:none;padding:20px;}
.page.active{display:block;}

.card{
background:rgba(20,25,40,0.85);
border:1px solid #00ffe5;
padding:15px;
margin:10px auto;
max-width:420px;
border-radius:15px;
}

/* POP */
.pop{
position:fixed;
top:50%;
left:50%;
transform:translate(-50%,-50%);
background:#000;
border:1px solid #00ffe5;
padding:12px;
border-radius:10px;
animation:pop 1s forwards;
z-index:9999;
white-space:pre;
}

@keyframes pop{
0%{opacity:0;}
20%{opacity:1;}
100%{opacity:0;}
}

/* CYBER RAIN */
.rain{
position:fixed;
top:-50px;
color:#00ffe5;
font-size:14px;
opacity:0.8;
animation:fall linear forwards;
pointer-events:none;
text-shadow:0 0 10px #00ffe5;
}

@keyframes fall{
to{
transform:translateY(110vh);
opacity:0;
}
}

</style>
</head>

<body>

<div class="header">CYBER MARKET</div>

<div class="nav">
<button onclick="show('home')">HOME</button>
<button onclick="show('cart')">CART</button>
<button onclick="show('history')">HISTORY</button>
<button onclick="show('wallet')">WALLET</button>
<button onclick="show('admin')">ADMIN</button>
</div>

<!-- HOME -->
<div id="home" class="page active">

<div class="card">
<h3>1 неделя</h3>
<p>300₽ / 4$ / 2💎</p>
<button onclick="add('1 неделя',2)">Добавить</button>
</div>

<div class="card">
<h3>1 месяц</h3>
<p>1000₽ / 13$ / 6💎</p>
<button onclick="add('1 месяц',6)">Добавить</button>
</div>

<div class="card">
<h3>Навсегда</h3>
<p>4000₽ / 52$ / 25💎</p>
<button onclick="add('Навсегда',25)">Добавить</button>
</div>

<div class="card">
<h3>АККАУНТ</h3>
<input id="login">
<input id="pass" type="password">
<button onclick="register()">Регистрация</button>
<button onclick="login()">Вход</button>
</div>

</div>

<!-- CART -->
<div id="cart" class="page"></div>

<!-- HISTORY -->
<div id="history" class="page"></div>

<!-- WALLET -->
<div id="wallet" class="page">

<div class="card">
<h3>TON WALLET</h3>

<p id="walletText">
UQAYHaet-WWovXy7HoH84ud8cz_VjENJAmuEySnVe9aiw2Dv
</p>

<button onclick="openWallet()">Открыть Tonkeeper</button>
<button onclick="copyWallet()">Скопировать</button>

</div>

<div class="card">
<h3>СВЯЗЬ</h3>

<a href="https://t.me/YOUR_USERNAME" target="_blank">
<button>Telegram</button>
</a>

<a href="https://tiktok.com/@YOUR_TIKTOK" target="_blank">
<button>TikTok</button>
</a>

</div>

</div>

<!-- ADMIN -->
<div id="admin" class="page">
<div class="card">
<h3>ADMIN</h3>
<input id="adminPass">
<button onclick="adminLogin()">Войти</button>
</div>
<div id="adminPanel"></div>
</div>

<script>

/* DB */
let DB = JSON.parse(localStorage.getItem("DB")||"{}");
if(!DB.users) DB.users={};
if(!DB.orders) DB.orders={};

let current = localStorage.getItem("current") || null;
let isAdmin=false;

function saveDB(){
localStorage.setItem("DB",JSON.stringify(DB));
}

/* AUTH */
function register(){
let l=document.getElementById("login").value;
let p=document.getElementById("pass").value;

if(DB.users[l]){
pop("USER EXISTS");
return;
}

DB.users[l]=p;
saveDB();
pop("REGISTER OK");
}

function login(){
let l=document.getElementById("login").value;
let p=document.getElementById("pass").value;

if(!DB.users[l]){
pop("NO USER");
return;
}

if(DB.users[l]!==p){
pop("WRONG PASSWORD");
return;
}

current=l;
localStorage.setItem("current",l);

pop("LOGIN OK");
render();
}

/* CART */
function cartKey(){return "cart_"+current;}
function getCart(){return JSON.parse(localStorage.getItem(cartKey())||"[]");}
function saveCart(c){localStorage.setItem(cartKey(),JSON.stringify(c));}

function add(item,price){
if(!current){pop("LOGIN FIRST");return;}

let c=getCart();
c.push({item,price});
saveCart(c);

pop("ADDED");
render();
}

/* BUY */
function buy(i){

let c=getCart();

let code =
"CYB-" +
Date.now().toString(36).toUpperCase() +
"-" +
Math.random().toString(36).substr(2,5).toUpperCase();

if(!DB.orders[current]) DB.orders[current]=[];

DB.orders[current].push({
item:c[i].item,
price:c[i].price,
code:code,
status:"ожидание оплаты"
});

saveDB();

let wallet="UQAYHaet-WWovXy7HoH84ud8cz_VjENJAmuEySnVe9aiw2Dv";

window.open(
`ton://transfer/${wallet}?amount=${c[i].price}&text=ORDER_${code}`,
"_blank"
);

c.splice(i,1);
saveCart(c);

pop("ОЖИДАНИЕ ОПЛАТЫ\n"+code+"\nНАПИШИ МЕНЕДЖЕРУ");

render();
}

/* WALLET */
function openWallet(){
window.open("ton://transfer/UQAYHaet-WWovXy7HoH84ud8cz_VjENJAmuEySnVe9aiw2Dv","_blank");
}

function copyWallet(){
navigator.clipboard.writeText(
document.getElementById("walletText").innerText
);
pop("COPIED");
}

/* ADMIN */
function adminLogin(){
if(document.getElementById("adminPass").value==="rahim_45_pro"){
isAdmin=true;
render();
}
}

/* NAV */
function show(id){
document.querySelectorAll(".page").forEach(p=>p.classList.remove("active"));
document.getElementById(id).classList.add("active");
render();
}

/* POP */
function pop(t){
let d=document.createElement("div");
d.className="pop";
d.innerText=t;
document.body.appendChild(d);
setTimeout(()=>d.remove(),1200);
}

/* RENDER */
function render(){

let c=document.getElementById("cart");
if(c){
let cart=getCart();
c.innerHTML="";
cart.forEach((e,i)=>{
c.innerHTML+=`
<div class="card">
${e.item}<br>
💎 ${e.price}<br>
<button onclick="buy(${i})">Оплатить</button>
</div>`;
});
}

let h=document.getElementById("history");
if(h){
h.innerHTML="";
if(DB.orders[current]){
DB.orders[current].forEach(o=>{
h.innerHTML+=`
<div class="card">
${o.item}<br>
${o.status}<br>
<b>${o.code}</b>
</div>`;
});
}
}

if(isAdmin){
let a=document.getElementById("adminPanel");
a.innerHTML="";

for(let u in DB.orders){
DB.orders[u].forEach(o=>{
a.innerHTML+=`
<div class="card">
${u}<br>
${o.item}<br>
${o.status}<br>
${o.code}
</div>`;
});
}
}
}

render();

/* CYBER RAIN */
setInterval(()=>{
let r=document.createElement("div");
r.className="rain";
r.innerText="|";
r.style.left=Math.random()*100+"vw";
r.style.animationDuration=(3+Math.random()*5)+"s";
document.body.appendChild(r);
setTimeout(()=>r.remove(),8000);
},120);

</script>

</body>
</html>
