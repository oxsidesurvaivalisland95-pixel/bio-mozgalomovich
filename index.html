<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CYBER MARKET</title>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

<style>
body {
    margin: 0;
    font-family: 'Segoe UI', Arial, sans-serif;
    background: 
        radial-gradient(circle at top left, #00ffe522, transparent),
        radial-gradient(circle at bottom right, #ff00ff22, transparent),
        linear-gradient(180deg, #05070d, #060912, #0a1020);
    color: white;
    overflow-x: hidden;
    min-height: 100vh;
}

.header {
    text-align: center;
    padding: 20px 10px;
}

.header h1 {
    margin: 0;
    font-size: 34px;
    color: #00ffe5;
    text-shadow: 0 0 20px #00ffe5;
}

.user-tag {
    font-size: 14px;
    color: #ff00ff;
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-top: 5px;
}

.nav {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 8px;
    padding: 10px;
    background: rgba(0, 0, 0, 0.4);
    backdrop-filter: blur(10px);
    position: sticky;
    top: 0;
    z-index: 1000;
}

button {
    background: linear-gradient(90deg, #00ffe5, #ff00ff);
    border: none;
    padding: 10px 15px;
    border-radius: 10px;
    color: white;
    font-weight: bold;
    cursor: pointer;
    box-shadow: 0 0 10px rgba(0, 255, 229, 0.3);
    transition: 0.3s;
}

button:hover {
    transform: scale(1.05);
    box-shadow: 0 0 20px #00ffe5;
}

.page { display: none; padding: 20px; padding-bottom: 120px; }
.page.active { display: block; animation: fadeIn 0.4s; }

@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

.card {
    max-width: 420px;
    margin: 15px auto;
    padding: 20px;
    background: rgba(10, 12, 20, 0.9);
    border: 1px solid #00ffe5;
    border-radius: 12px;
}

input {
    width: 100%;
    padding: 12px;
    margin: 10px 0;
    border-radius: 8px;
    border: 1px solid #333;
    background: #000;
    color: white;
    box-sizing: border-box;
}

.toast {
    position: fixed;
    bottom: 100px;
    left: 50%;
    transform: translateX(-50%);
    background: #00ffe5;
    color: black;
    padding: 12px 20px;
    border-radius: 10px;
    font-weight: bold;
    z-index: 9999;
    animation: toast 2s ease forwards;
}

@keyframes toast {
    0% { opacity: 0; transform: translate(-50%, 20px); }
    15% { opacity: 1; transform: translate(-50%, 0); }
    85% { opacity: 1; transform: translate(-50%, 0); }
    100% { opacity: 0; transform: translate(-50%, -20px); }
}

.order {
    margin-top: 10px;
    padding: 12px;
    border: 1px solid #333;
    border-left: 4px solid #00ffe5;
    border-radius: 8px;
    background: rgba(255, 255, 255, 0.05);
}

.socials {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    display: flex;
    justify-content: center;
    gap: 15px;
    padding: 15px;
    background: rgba(0, 0, 0, 0.9);
    z-index: 1001;
}

.cyberRain {
    position: fixed;
    top: -50px;
    color: #00ffe5;
    font-size: 14px;
    pointer-events: none;
    z-index: -1;
    animation: fall linear forwards;
}

@keyframes fall { to { transform: translateY(110vh); opacity: 0; } }
</style>
</head>

<body>

<div class="header">
    <h1>CYBER MARKET</h1>
    <div class="user-tag">@mozgalomovich</div>
</div>

<div class="nav">
    <button onclick="show('auth')">АККАУНТ</button>
    <button onclick="show('shop')">МАГАЗИН</button>
    <button onclick="show('cart')">КОРЗИНА</button>
    <button onclick="show('history')">ИСТОРИЯ</button>
    <button onclick="show('admin')">АДМИН</button>
</div>

<!-- AUTH -->
<div id="auth" class="page active">
    <div class="card" id="authContent">
        <h3>ВХОД / РЕГИСТРАЦИЯ</h3>
        <input id="email" type="email" placeholder="Email">
        <input id="password" type="password" placeholder="Пароль (мин. 6 знаков)">
        <div style="display:flex; gap:10px;">
            <button onclick="register()" style="flex:1">СОЗДАТЬ</button>
            <button onclick="login()" style="flex:1">ВОЙТИ</button>
        </div>
    </div>
</div>

<!-- SHOP -->
<div id="shop" class="page">
    <div class="card">
        <h3>1 неделя</h3>
        <p>300₽ / 4$ / 2💎</p>
        <button onclick="addCart('1 неделя', 2)" style="width:100%">В КОРЗИНУ</button>
    </div>
    <div class="card">
        <h3>1 месяц</h3>
        <p>1000₽ / 13$ / 6💎</p>
        <button onclick="addCart('1 месяц', 6)" style="width:100%">В КОРЗИНУ</button>
    </div>
    <div class="card">
        <h3>Навсегда</h3>
        <p>4000₽ / 52$ / 25💎</p>
        <button onclick="addCart('Навсегда', 25)" style="width:100%">В КОРЗИНУ</button>
    </div>
</div>

<!-- CART -->
<div id="cart" class="page">
    <div class="card">
        <h3>ВАША КОРЗИНА</h3>
        <div id="cartBox">Корзина пуста</div>
        
        <div id="paymentBlock" style="display:none; margin-top:20px; border-top:1px solid #333; padding-top:15px;">
            <h4>ОПЛАТА TON</h4>
            <input id="wallet" value="UQAYHaet-WWovXy7HoH84ud8cz_VjENJAmuEySnVe9aiw2Dv" readonly>
            <button onclick="copyWallet()" style="width:100%; margin-bottom:8px;">СКОПИРОВАТЬ АДРЕС</button>
            <button onclick="openTon()" style="width:100%; background: #0088cc;">ОТКРЫТЬ TONKEEPER</button>
        </div>
    </div>
</div>

<!-- HISTORY -->
<div id="history" class="page">
    <div class="card">
        <h3>ИСТОРИЯ ЗАКАЗОВ</h3>
        <div id="hist">Войдите в аккаунт</div>
    </div>
</div>

<!-- ADMIN -->
<div id="admin" class="page">
    <div class="card">
        <h3>ПАНЕЛЬ АДМИНИСТРАТОРА</h3>
        <div id="adminAuth">
            <input id="admPass" type="password" placeholder="Введите пароль админа">
            <button onclick="checkAdmin()" style="width:100%">ВОЙТИ</button>
        </div>
        <div id="adminPanel" style="display:none;">
            <h4>Все заказы:</h4>
            <div id="ordersList"></div>
        </div>
    </div>
</div>

<!-- SOCIALS -->
<div class="socials">
    <a href="https://t.me/bio_mozgalom" target="_blank"><button style="background:#0088cc">TELEGRAM</button></a>
    <a href="https://www.tiktok.com/@mozgalomovich?_r=1&_t=ZS-96E1FTEA933" target="_blank"><button style="background:#000; border:1px solid #ff00ff">TIKTOK</button></a>
</div>

<script>
/* FIREBASE */
let auth, db;
try {
    firebase.initializeApp({
        apiKey: "AIzaSyD94vjwnRQIYC-2Le_nmxtsVKlU6Oww6VE",
        authDomain: "mozgalom-site.firebaseapp.com",
        projectId: "mozgalom-site",
        storageBucket: "mozgalom-site.appspot.com",
        appId: "1:564649897907:web:61503121e661fb6a82a5c6"
    });
    auth = firebase.auth();
    db = firebase.firestore();
} catch(e) { console.error("Firebase Init Error", e); }

/* UI */
function show(id) {
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.getElementById(id).classList.add('active');
}

function toast(t) {
    const d = document.createElement("div");
    d.className = "toast";
    d.innerText = t;
    document.body.appendChild(d);
    setTimeout(() => d.remove(), 2000);
}

/* АВТОРИЗАЦИЯ */
function register() {
    const e = document.getElementById("email").value;
    const p = document.getElementById("password").value;
    if(!e || p.length < 6) return toast("Email и пароль (мин 6 симв)!");
    
    auth.createUserWithEmailAndPassword(e, p)
        .then(() => { toast("АККАУНТ СОЗДАН!"); })
        .catch(err => { 
            console.error(err);
            toast("ОШИБКА: " + err.message); 
        });
}

function login() {
    const e = document.getElementById("email").value;
    const p = document.getElementById("password").value;
    auth.signInWithEmailAndPassword(e, p)
        .then(() => { toast("ВХОД ВЫПОЛНЕН!"); })
        .catch(err => { toast("НЕВЕРНЫЕ ДАННЫЕ"); });
}

function logout() {
    auth.signOut().then(() => location.reload());
}

/* МАГАЗИН */
let cart = [];
function addCart(n, p) {
    cart.push({n, p});
    toast("ДОБАВЛЕНО");
    renderCart();
}

function renderCart() {
    const box = document.getElementById("cartBox");
    const pBlock = document.getElementById("paymentBlock");
    if (cart.length === 0) {
        box.innerHTML = "Корзина пуста";
        pBlock.style.display = "none";
        return;
    }
    pBlock.style.display = "block";
    box.innerHTML = cart.map((item, i) => `
        <div class="order">
            <b>${item.n}</b> — ${item.p}💎
            <div style="margin-top:8px;">
                <button onclick="confirmBuy('${item.n}', ${item.p}, ${i})" style="padding:5px 10px; font-size:11px;">КУПИТЬ</button>
                <button onclick="cart.splice(${i},1);renderCart();" style="padding:5px 10px; font-size:11px; background:red;">УДАЛИТЬ</button>
            </div>
        </div>
    `).join("");
}

function confirmBuy(n, p, index) {
    if(!auth.currentUser) return toast("СНАЧАЛА ВОЙДИТЕ!");
    
    db.collection("orders").add({
        uid: auth.currentUser.uid,
        email: auth.currentUser.email,
        product: n,
        price: p,
        code: "CYB-" + Math.random().toString(36).slice(2, 9).toUpperCase(),
        status: "pending",
        time: Date.now()
    }).then(() => {
        toast("ЗАКАЗ ОФОРМЛЕН!");
        cart.splice(index, 1);
        renderCart();
        show('history');
    }).catch(e => toast("ОШИБКА БАЗЫ"));
}

/* СЛЕЖКА ЗА СОСТОЯНИЕМ */
auth.onAuthStateChanged(user => {
    if (user) {
        document.getElementById("authContent").innerHTML = `
            <h3>ВАШ АККАУНТ</h3>
            <p style="color:#00ffe5">${user.email}</p>
            <button onclick="logout()" style="width:100%">ВЫЙТИ</button>
        `;
        
        db.collection("orders").where("uid", "==", user.uid).orderBy("time", "desc")
          .onSnapshot(snap => {
              const h = document.getElementById("hist");
              if(snap.empty) { h.innerHTML = "У вас нет заказов"; return; }
              h.innerHTML = snap.docs.map(doc => {
                  const d = doc.data();
                  const color = d.status === 'paid' ? '#00ff00' : '#ff00ff';
                  return `<div class="order" style="border-color:${color}">
                      <b>${d.product}</b><br>
                      Код: ${d.code} | <span style="color:${color}">${d.status.toUpperCase()}</span>
                  </div>`;
              }).join("");
          });
    }
});

/* АДМИН ПАНЕЛЬ */
function checkAdmin() {
    const p = document.getElementById("admPass").value;
    if(p === "rahim_45_pro") {
        document.getElementById("adminAuth").style.display = "none";
        document.getElementById("adminPanel").style.display = "block";
        loadAdminOrders();
    } else {
        toast("НЕВЕРНЫЙ ПАРОЛЬ");
    }
}

function loadAdminOrders() {
    db.collection("orders").orderBy("time", "desc").onSnapshot(snap => {
        const list = document.getElementById("ordersList");
        if(snap.empty) { list.innerHTML = "Заказов нет"; return; }
        list.innerHTML = snap.docs.map(doc => {
            const d = doc.data();
            return `
            <div class="order" style="font-size:12px;">
                <b>${d.email}</b><br>
                Товар: ${d.product} (${d.code})<br>
                Статус: ${d.status}<br>
                <div style="margin-top:5px;">
                    <button onclick="updateStatus('${doc.id}', 'paid')" style="padding:3px 8px; font-size:10px;">ОПЛАЧЕНО</button>
                    <button onclick="updateStatus('${doc.id}', 'del')" style="padding:3px 8px; font-size:10px; background:red;">УДАЛИТЬ</button>
                </div>
            </div>`;
        }).join("");
    });
}

function updateStatus(id, type) {
    if(type === 'paid') db.collection("orders").doc(id).update({status: "paid"});
    else db.collection("orders").doc(id).delete();
    toast("ВЫПОЛНЕНО");
}

/* ДОП */
function copyWallet() {
    const w = document.getElementById("wallet");
    w.select();
    navigator.clipboard.writeText(w.value);
    toast("АДРЕС СКОПИРОВАН");
}

function openTon() { window.location.href = "tonkeeper://"; }

/* ДОЖДЬ */
setInterval(() => {
    const r = document.createElement("div");
    r.className = "cyberRain";
    r.innerText = Math.random() > 0.5 ? "1" : "0";
    r.style.left = Math.random() * 100 + "vw";
    r.style.animationDuration = (2 + Math.random() * 3) + "s";
    document.body.appendChild(r);
    setTimeout(() => r.remove(), 5000);
}, 200);
</script>

</body>
</html>
