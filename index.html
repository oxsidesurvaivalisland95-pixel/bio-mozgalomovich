<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MOZGALOM ELITE | SAKURA CYBERPUNK</title>

    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;900&family=Montserrat:wght@400;700&display=swap" rel="stylesheet">

    <style>
        :root { --n: #00ffe5; --p: #ff00ff; --bg: #05070d; --card: rgba(255, 255, 255, 0.08); --neon-g: #00ff41; --sakura: #ffb7c5; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }
        body { margin:0; font-family: 'Montserrat', sans-serif; background: var(--bg); color: #fff; min-height: 100vh; overflow-x: hidden; }

        #bg-canvas { position: fixed; top: 0; left: 0; z-index: -1; opacity: 0.5; pointer-events: none; }

        .header { text-align:center; padding:20px; border-bottom: 2px solid var(--p); background: rgba(0,0,0,0.7); backdrop-filter: blur(15px); }
        .neon-title { font-family: 'Orbitron'; font-size: 24px; font-weight: 900; background: linear-gradient(90deg, var(--n), var(--p), var(--sakura)); background-size: 200%; -webkit-background-clip: text; -webkit-text-fill-color: transparent; animation: shine 4s linear infinite; text-transform: uppercase; letter-spacing: 3px; }
        @keyframes shine { to { background-position: 200%; } }

        .nav { display:flex; gap:8px; padding:10px; overflow-x:auto; background: rgba(0,0,0,0.9); position:sticky; top:0; z-index:1000; border-bottom: 1px solid var(--n); }
        .nav button { flex:0 0 auto; background:transparent; border:1px solid var(--n); padding:8px 15px; border-radius:10px; color:var(--n); font-weight:bold; font-size:10px; cursor:pointer; transition: 0.3s; }
        .nav button.active { background: var(--p); color:#fff; border-color: var(--p); box-shadow: 0 0 15px var(--p); }

        .page { display:none; padding:15px; width:100%; max-width: 450px; margin:0 auto; padding-bottom: 100px; position: relative; z-index: 1; }
        .page.active { display:block; }

        .card { background: var(--card); border: 1px solid rgba(255, 0, 255, 0.2); border-radius: 20px; padding: 20px; margin-bottom: 15px; backdrop-filter: blur(10px); position: relative; overflow: hidden; }
        .price-tag { font-size: 26px; font-weight: 900; color: var(--n); font-family: 'Orbitron'; margin: 10px 0; text-shadow: 0 0 10px var(--n); }
        .price-sub { font-size: 12px; color: var(--sakura); font-weight: bold; margin-top: -5px; margin-bottom: 15px; opacity: 0.9; }
        
        .buy-btn { width:100%; padding:15px; border-radius:12px; border:none; background: linear-gradient(45deg, var(--p), var(--n)); color:#fff; font-weight:900; cursor:pointer; font-family:'Orbitron'; font-size: 14px; box-shadow: 0 4px 15px rgba(255,0,255,0.3); }

        .ton-btn { display: block; width: 100%; padding: 12px; margin-top: 15px; background: rgba(0, 0, 0, 0.6); border: 2px solid var(--n); border-radius: 12px; color: var(--n); font-family: 'Orbitron'; font-weight: 900; text-decoration: none; text-align: center; font-size: 12px; }

        .order-item { border-left: 4px solid var(--p); margin-bottom: 10px; padding: 12px; background: rgba(255,255,255,0.03); border-radius: 0 12px 12px 0; }
        
        .roulette-wrapper { height: 80px; border: 2px solid var(--sakura); border-radius: 15px; margin: 15px 0; overflow: hidden; position: relative; background: #000; }
        .roulette-line { position: absolute; left: 50%; top: 0; width: 2px; height: 100%; background: var(--n); z-index: 5; box-shadow: 0 0 10px var(--n); }
        .roulette-tape { display: flex; align-items: center; position: absolute; left: 0; height: 100%; transition: 5s cubic-bezier(0.1, 0, 0.1, 1); }
        .case-item { width: 80px; flex-shrink: 0; text-align: center; font-size: 24px; }
        .spins-counter { font-family: 'Orbitron'; color: var(--sakura); font-size: 18px; text-shadow: 0 0 10px var(--sakura); margin: 10px 0; }

        input { width:100%; padding:14px; margin:8px 0; border-radius:12px; border:1px solid var(--p); background:rgba(0,0,0,0.5); color:#fff; }

        .adm-card { background: rgba(0,0,0,0.8); border: 1px solid #444; padding: 15px; border-radius: 15px; margin-bottom: 10px; font-size: 11px; border-left: 4px solid var(--p); }
        .adm-btn-ok { background: var(--neon-g); color: #000; border: none; padding: 6px 12px; border-radius: 8px; font-weight: bold; cursor: pointer; }
        .adm-btn-del { background: #ff4444; color: #fff; border: none; padding: 6px 12px; border-radius: 8px; font-weight: bold; cursor: pointer; margin-left: 5px; }

        .footer { background:#000; padding:20px; text-align:center; border-top: 1px solid var(--p); position: relative; z-index: 1; }
        .f-links a { color: var(--sakura); text-decoration:none; margin:0 10px; font-size:12px; font-weight:bold; }
    </style>
</head>
<body>

<canvas id="bg-canvas"></canvas>

<div class="header">
    <div class="neon-title">MOZGALOM ELITE</div>
</div>

<div class="nav">
    <button id="n-shop" onclick="show('shop')" class="active">МАРКЕТ</button>
    <button id="n-cases" onclick="show('cases')">КЕЙСЫ</button>
    <button id="n-history" onclick="show('history')">ЗАКАЗЫ</button>
    <button id="n-auth" onclick="show('auth')">ПРОФИЛЬ</button>
    <button id="n-admin" onclick="show('admin')" style="color:var(--p); border-color:var(--p)">ADM</button>
</div>

<div id="shop" class="page active">
    <div class="card">
        <h3 style="color: var(--sakura);">1 НЕДЕЛЯ (PRO)</h3>
        <div class="price-tag">300₽</div>
        <div class="price-sub">4$ | 2 💎</div>
        <button class="buy-btn" onclick="buy('1 НЕДЕЛЯ PRO', 300, 7)">КУПИТЬ ТАРИФ</button>
    </div>
    <div class="card">
        <h3 style="color: var(--sakura);">1 МЕСЯЦ (ULTRA)</h3>
        <div class="price-tag">1000₽</div>
        <div class="price-sub">13$ | 6 💎</div>
        <button class="buy-btn" onclick="buy('1 МЕСЯЦ ULTRA', 1000, 30)">КУПИТЬ ТАРИФ</button>
    </div>
    <div class="card">
        <h3 style="color: var(--sakura);">FOREVER (LEGEND)</h3>
        <div class="price-tag">4000₽</div>
        <div class="price-sub">52$ | 25 💎</div>
        <button class="buy-btn" onclick="buy('LEGEND', 4000, 99999)">СТАТЬ ЛЕГЕНДОЙ</button>
    </div>
</div>

<div id="cases" class="page">
    <div class="card" style="text-align:center;">
        <h2 style="color:var(--sakura); font-family:Orbitron; margin:0;">LUCKY SLOT</h2>
        <div id="spins_display" class="spins-counter">КРУТОК: 0</div>
        <div class="roulette-wrapper">
            <div class="roulette-line"></div>
            <div id="tape" class="roulette-tape"></div>
        </div>
        <button id="spin_trigger" class="buy-btn" style="display:none; margin-bottom:10px;" onclick="startSpin()">ЗАПУСТИТЬ</button>
        <button class="buy-btn" style="background:transparent; border:1px solid var(--n); color:var(--n);" onclick="buy('CASE SPIN', 100, 0)">КУПИТЬ КЕЙС (100₽)</button>
    </div>
</div>

<div id="history" class="page">
    <div class="card">
        <h4 style="margin:0; color:var(--n)">ОПЛАТА TON / КАРТА</h4>
        <code id="w-addr" onclick="copyW()" style="font-size:10px; word-break:break-all; display:block; margin:10px 0; color:#aaa;">UQAYHaet-WWovXy7HoH84ud8cz_VjENJAmuEySnVe9aiw2Dv</code>
        <a href="https://tonkeeper.com/" class="ton-btn">ОТКРЫТЬ TONKEEPER</a>
    </div>
    <div id="h_list">Загрузка...</div>
</div>

<div id="auth" class="page">
    <div id="uProfile" style="display:none;">
        <div class="card"><h3 id="uEmail" style="font-family:Orbitron; color:var(--sakura)">...</h3><button onclick="auth.signOut().then(()=>location.reload())" style="background:red; color:#fff; border:none; width:100%; padding:10px; border-radius:10px;">ВЫЙТИ</button></div>
    </div>
    <div id="loginCard" class="card"><input id="u_nick" type="text" placeholder="Ваш Ник"><input id="u_pass" type="password" placeholder="Пароль"><button class="buy-btn" onclick="doLogin()">ВХОД / РЕГИСТРАЦИЯ</button></div>
</div>

<div id="admin" class="page">
    <div id="adm_login_box" class="card">
        <input id="a_pass" type="password" placeholder="Admin Key">
        <button class="buy-btn" onclick="goAdmin()">ВХОД В СИСТЕМУ</button>
    </div>
    <div id="a_panel" style="display:none;"></div>
</div>

<div class="footer"><div class="f-links"><a href="https://t.me/bio_mozgalom">CHANNEL</a><a href="https://t.me/mozgalomovich">OWNER</a></div></div>

<script>
// --- CONFIG & FIREBASE ---
const TG_TOKEN = "8538869779:AAGSu2F22Tx0TAtRH2gXPlF4ZNsPVKTt3lw";
const TG_CHAT_ID = "7910835075";
const MY_WALLET = "UQAYHaet-WWovXy7HoH84ud8cz_VjENJAmuEySnVe9aiw2Dv";

const firebaseConfig = { apiKey: "AIzaSyD94vjwnRQIYC-2Le_nmxtsVKlU6Oww6VE", authDomain: "mozgalom-site.firebaseapp.com", projectId: "mozgalom-site", storageBucket: "mozgalom-site.appspot.com", appId: "1:564649897907:web:61503121e661fb6a82a5c6" };
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

let userSpins = 0;

// --- AUTO-CHECKER ---
async function checkTon() {
    try {
        const r = await fetch(`https://toncenter.com/api/v2/getTransactions?address=${MY_WALLET}&limit=10`);
        const res = await r.json();
        if(!res.ok) return;
        const pendings = await db.collection("orders").where("status", "==", "pending").get();
        res.result.forEach(tx => {
            const comm = (tx.in_msg.message || tx.in_msg.msg_data?.text || "").toUpperCase();
            pendings.forEach(doc => {
                if(comm.includes(doc.data().code)) confirmOrder(doc.id, doc.data().duration_days, doc.data().uid);
            });
        });
    } catch(e){}
}
setInterval(checkTon, 30000);

function confirmOrder(docId, days, uid) {
    let exp = "БЕССРОЧНО";
    if(days > 0 && days < 50000) {
        let d = new Date(); d.setDate(d.getDate() + days); exp = d.toLocaleDateString();
    }
    db.collection('orders').doc(docId).update({ status: 'paid', expire_str: exp }).then(() => {
        if(days === 0) db.collection('users').doc(uid).set({ spins: firebase.firestore.FieldValue.increment(1) }, {merge:true});
    });
}

function buy(name, price, days) {
    if(!auth.currentUser) return show('auth');
    const orderId = "MZ" + Math.random().toString(36).substr(2,4).toUpperCase();
    db.collection("orders").add({
        uid: auth.currentUser.uid, email: auth.currentUser.email,
        product: name, price: price, code: orderId,
        status: "pending", timestamp: Date.now(), date_str: new Date().toLocaleString(),
        duration_days: days
    }).then(() => {
        fetch(`https://api.telegram.org/bot${TG_TOKEN}/sendMessage?chat_id=${TG_CHAT_ID}&text=${encodeURIComponent("🛒 ЗАКАЗ: "+orderId+"\n"+name)}`, {mode:'no-cors'});
        alert("ЗАКАЗ: " + orderId + "\nОплатите и ожидайте!");
        show('history');
    });
}

// --- ROULETTE ---
const items = ["🎁", "🎟️", "💎", "🔥", "💰", "⚡", "🌟"];
function startSpin() {
    if(userSpins <= 0) return;
    userSpins--;
    db.collection('users').doc(auth.currentUser.uid).update({ spins: userSpins });
    const tape = document.getElementById('tape');
    tape.innerHTML = "";
    for(let i=0; i<60; i++) {
        const div = document.createElement('div');
        div.className = 'case-item';
        div.innerText = items[Math.floor(Math.random()*items.length)];
        tape.appendChild(div);
    }
    tape.style.transition = "none"; tape.style.left = "0";
    setTimeout(() => {
        tape.style.transition = "5s cubic-bezier(0.1, 0, 0.1, 1)";
        tape.style.left = `-${(50 * 80) - 180}px`;
    }, 100);
    setTimeout(() => {
        const prizes = ["Скидка 30%", "PRO +3 дня", "ULTRA +1 день", "Скидка 15%", "VIP Доступ"];
        const win = prizes[Math.floor(Math.random()*prizes.length)];
        alert("ВЫИГРЫШ: " + win);
        db.collection("orders").add({ uid: auth.currentUser.uid, email: auth.currentUser.email, product: "ВЫИГРЫШ: " + win, status: "paid", timestamp: Date.now(), date_str: new Date().toLocaleString() });
    }, 5500);
}

// --- AUTH OBSERVER ---
auth.onAuthStateChanged(u => {
    if(u) {
        document.getElementById('loginCard').style.display = 'none';
        document.getElementById('uProfile').style.display = 'block';
        document.getElementById('uEmail').innerText = u.email.split('@')[0].toUpperCase();
        db.collection('users').doc(u.uid).onSnapshot(doc => {
            userSpins = (doc.data() && doc.data().spins) ? doc.data().spins : 0;
            document.getElementById('spins_display').innerText = `КРУТОК: ${userSpins}`;
            document.getElementById('spin_trigger').style.display = userSpins > 0 ? 'inline-block' : 'none';
        });
        db.collection("orders").where("uid","==",u.uid).onSnapshot(s => {
            document.getElementById("h_list").innerHTML = s.docs.sort((a,b)=>b.data().timestamp-a.data().timestamp).map(d => `
                <div class="order-item" style="border-color: ${d.data().status=='paid'?'#0f8':'var(--p)'}">
                    <b>${d.data().product}</b> <small style="float:right">${d.data().status}</small><br>
                    <small>ID: ${d.data().code || '---'}</small>
                    ${d.data().expire_str ? `<div style="font-size:9px; color:var(--sakura)">ДО: ${d.data().expire_str}</div>` : ''}
                </div>`).join("");
        });
    }
});

// --- ADMIN SYSTEM ---
function goAdmin() {
    if(document.getElementById("a_pass").value === "rahim_45_pro") {
        document.getElementById("adm_login_box").style.display = "none";
        document.getElementById("a_panel").style.display = "block";
        db.collection("orders").orderBy("timestamp", "desc").limit(25).onSnapshot(s => {
            document.getElementById("a_panel").innerHTML = s.docs.map(d => {
                const data = d.data();
                const isPaid = data.status === 'paid';
                return `
                <div class="adm-card">
                    <div style="font-family:Orbitron; color:var(--n)">${data.product}</div>
                    <div><b>USER:</b> ${data.email.split('@')[0]} | <b>ID:</b> ${data.code || 'BOX'}</div>
                    <div style="color:#aaa">${data.date_str}</div>
                    <div style="margin-top:8px">
                        ${!isPaid ? `<button class="adm-btn-ok" onclick="confirmOrder('${d.id}', ${data.duration_days}, '${data.uid}')">ОК</button>` : ''}
                        <button class="adm-btn-del" onclick="db.collection('orders').doc('${d.id}').delete()">УДАЛИТЬ</button>
                    </div>
                </div>`;
            }).join("");
        });
    }
}

function show(id) {
    document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
    document.querySelectorAll('.nav button').forEach(b=>b.classList.remove('active'));
    document.getElementById(id).classList.add('active');
    document.getElementById('n-'+id).classList.add('active');
}

function doLogin() {
    const nick = document.getElementById('u_nick').value.trim().toLowerCase();
    const pass = document.getElementById('u_pass').value;
    auth.signInWithEmailAndPassword(nick+"@moz.me", pass).catch(() => {
        auth.createUserWithEmailAndPassword(nick+"@moz.me", pass).catch(e => alert(e.message));
    });
}

function copyW() { navigator.clipboard.writeText(MY_WALLET); alert("Скопировано!"); }

// --- BACKGROUND: MATRIX + SAKURA ---
const canvas = document.getElementById('bg-canvas');
const ctx = canvas.getContext('2d');
canvas.width = window.innerWidth; canvas.height = window.innerHeight;

const columns = Math.floor(canvas.width / 20);
const drops = Array(columns).fill(0);
const petals = [];

for(let i=0; i<35; i++) {
    petals.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        r: Math.random() * 4 + 2,
        s: Math.random() * 1.5 + 0.5,
        a: Math.random() * 2
    });
}

function draw() {
    ctx.fillStyle = 'rgba(5, 7, 13, 0.15)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Matrix
    ctx.fillStyle = '#00ffe5';
    ctx.font = '15px monospace';
    drops.forEach((y, i) => {
        ctx.fillText(Math.floor(Math.random()*2), i*20, y);
        if(y > canvas.height && Math.random() > 0.975) drops[i] = 0; else drops[i] += 20;
    });

    // Sakura
    ctx.fillStyle = '#ffb7c5';
    petals.forEach(p => {
        ctx.beginPath();
        ctx.ellipse(p.x, p.y, p.r, p.r/1.5, p.a, 0, Math.PI * 2);
        ctx.fill();
        p.y += p.s;
        p.x += Math.sin(p.y / 50);
        if(p.y > canvas.height) { p.y = -10; p.x = Math.random() * canvas.width; }
    });
}
setInterval(draw, 60);
</script>
</body>
</html>
