<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CYBER MARKET</title>

<!-- FIREBASE -->
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

<style>

/* =========================
BASE
========================= */

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:Arial,sans-serif;
overflow-x:hidden;
color:white;

background:
radial-gradient(circle at top left,#00ffe522,transparent 30%),
radial-gradient(circle at bottom right,#ff00ff22,transparent 30%),
linear-gradient(180deg,#05070d,#060912,#0a1020);

min-height:100vh;
}

/* =========================
SCANLINES
========================= */

body::before{
content:"";
position:fixed;
inset:0;
pointer-events:none;

background:
repeating-linear-gradient(
to bottom,
rgba(255,255,255,0.02),
rgba(255,255,255,0.02) 1px,
transparent 3px,
transparent 6px
);

animation:scanMove 6s linear infinite;
z-index:999;
}

@keyframes scanMove{
0%{transform:translateY(0);}
100%{transform:translateY(10px);}
}

/* =========================
HEADER
========================= */

.header{
text-align:center;
padding:24px;
font-size:34px;
font-weight:bold;

color:#00ffe5;

text-shadow:
0 0 10px #00ffe5,
0 0 20px #00ffe5,
0 0 40px #ff00ff;
}

/* =========================
NAV
========================= */

.nav{
display:flex;
flex-wrap:wrap;
justify-content:center;
gap:10px;

padding:14px;

background:rgba(0,0,0,0.45);

backdrop-filter:blur(12px);

border-bottom:1px solid #00ffe566;
}

button{

background:
linear-gradient(90deg,#00ffe5,#ff00ff);

border:none;

padding:10px 16px;

border-radius:10px;

cursor:pointer;

color:white;

font-weight:bold;

transition:.2s;

box-shadow:
0 0 10px #00ffe588,
0 0 20px #ff00ff55;
}

button:hover{
transform:scale(1.05);
filter:brightness(1.1);
}

button:active{
transform:scale(0.92);
}

/* =========================
PAGES
========================= */

.page{
display:none;
padding:20px;
}

.page.active{
display:block;
}

/* =========================
CARDS
========================= */

.card{

max-width:430px;

margin:15px auto;

padding:18px;

border-radius:16px;

background:
linear-gradient(
180deg,
rgba(20,25,40,0.92),
rgba(10,12,20,0.96)
);

border:1px solid #00ffe577;

backdrop-filter:blur(10px);

box-shadow:
0 0 15px #00ffe522,
0 0 30px #ff00ff11;
}

.card h3{
margin-bottom:10px;
}

.card p{
margin:6px 0;
}

/* =========================
INPUTS
========================= */

input{

width:100%;

padding:12px;

margin-top:10px;

border-radius:10px;

border:1px solid #00ffe566;

background:#0d1320;

color:white;
}

/* =========================
POP
========================= */

.pop{
position:fixed;

top:50%;
left:50%;

transform:translate(-50%,-50%);

padding:14px 18px;

border-radius:12px;

background:#05070d;

border:1px solid #00ffe5;

z-index:99999;

box-shadow:
0 0 15px #00ffe5aa,
0 0 30px #ff00ff55;

animation:fade 1.2s forwards;
}

@keyframes fade{
0%{
opacity:0;
transform:translate(-50%,-50%) scale(.8);
}

15%{
opacity:1;
transform:translate(-50%,-50%) scale(1);
}

100%{
opacity:0;
}
}

/* =========================
CYBER RAIN
========================= */

.cyberRain{
position:fixed;
top:-50px;

color:#00ffe5;

font-size:14px;

pointer-events:none;

text-shadow:
0 0 5px #00ffe5,
0 0 15px #00ffe5;

animation:cyberFall linear forwards;

z-index:0;
}

@keyframes cyberFall{
to{
transform:translateY(110vh);
opacity:0;
}
}

/* =========================
ORDER BOX
========================= */

.orderBox{
padding:10px;
margin-top:10px;
border-radius:10px;
background:#0c1320;
border:1px solid #00ffe544;
}

/* =========================
SOCIALS
========================= */

.socials{
position:fixed;
bottom:15px;
left:50%;
transform:translateX(-50%);
display:flex;
gap:10px;
z-index:9999;
}

</style>
</head>

<body>

<div class="header">CYBER MARKET</div>

<div class="nav">
<button onclick="showPage('auth')">AUTH</button>
<button onclick="showPage('shop')">SHOP</button>
<button onclick="showPage('cart')">CART</button>
<button onclick="showPage('history')">HISTORY</button>
<button onclick="showPage('wallet')">WALLET</button>
<button onclick="showPage('admin')">ADMIN</button>
</div>

<!-- AUTH -->
<div id="auth" class="page active">

<div class="card">

<h3>LOGIN / REGISTER</h3>

<input id="email" placeholder="email">

<input id="password" type="password" placeholder="password">

<button style="margin-top:12px;" onclick="register()">
REGISTER
</button>

<button style="margin-top:12px;" onclick="login()">
LOGIN
</button>

</div>

</div>

<!-- SHOP -->
<div id="shop" class="page">

<div class="card">

<h3>1 неделя</h3>

<p>300₽ / 4$ / 2💎</p>

<button onclick="buyProduct('1 неделя',2)">
КУПИТЬ
</button>

</div>

<div class="card">

<h3>1 месяц</h3>

<p>1000₽ / 13$ / 6💎</p>

<button onclick="buyProduct('1 месяц',6)">
КУПИТЬ
</button>

</div>

<div class="card">

<h3>Навсегда</h3>

<p>4000₽ / 52$ / 25💎</p>

<button onclick="buyProduct('Навсегда',25)">
КУПИТЬ
</button>

</div>

</div>

<!-- CART -->
<div id="cart" class="page">

<div class="card">

<h3>КОРЗИНА</h3>

<div id="cartItems">
<p>После покупки заказ появится тут.</p>
</div>

</div>

</div>

<!-- HISTORY -->
<div id="history" class="page">

<div class="card">

<h3>ИСТОРИЯ</h3>

<div id="historyItems"></div>

</div>

</div>

<!-- WALLET -->
<div id="wallet" class="page">

<div class="card">

<h3>TONKEEPER</h3>

<p id="walletAddress">
UQAYHaet-WWovXy7HoH84ud8cz_VjENJAmuEySnVe9aiw2Dv
</p>

<button onclick="openTonkeeper()">
ОТКРЫТЬ TONKEEPER
</button>

<button onclick="copyWallet()">
СКОПИРОВАТЬ
</button>

</div>

</div>

<!-- ADMIN -->
<div id="admin" class="page">

<div class="card">

<h3>ADMIN LOGIN</h3>

<input id="adminPassword" placeholder="пароль">

<button style="margin-top:10px;" onclick="adminLogin()">
ВОЙТИ
</button>

</div>

<div class="card">

<h3>LIVE ORDERS</h3>

<div id="adminOrders"></div>

</div>

</div>

<!-- SOCIALS -->
<div class="socials">

<a href="https://t.me/" target="_blank">
<button>TELEGRAM</button>
</a>

<a href="https://www.tiktok.com/" target="_blank">
<button>TIKTOK</button>
</a>

</div>

<script>

/* =========================
FIREBASE
========================= */

const firebaseConfig = {

apiKey:"YOUR_API_KEY",

authDomain:"YOUR_PROJECT.firebaseapp.com",

projectId:"YOUR_PROJECT_ID",

appId:"YOUR_APP_ID"

};

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();

const db = firebase.firestore();

/* =========================
STATE
========================= */

let currentUser = null;

/* =========================
PAGES
========================= */

function showPage(id){

document
.querySelectorAll(".page")
.forEach(p=>p.classList.remove("active"));

document
.getElementById(id)
.classList.add("active");

}

/* =========================
POP
========================= */

function showPop(text){

const div=document.createElement("div");

div.className="pop";

div.innerText=text;

document.body.appendChild(div);

setTimeout(()=>{
div.remove();
},1200);

}

/* =========================
CYBER RAIN
========================= */

setInterval(()=>{

const r=document.createElement("div");

r.className="cyberRain";

r.innerText="|";

r.style.left=Math.random()*100+"vw";

r.style.animationDuration=
(3+Math.random()*5)+"s";

document.body.appendChild(r);

setTimeout(()=>{
r.remove();
},8000);

},120);

/* =========================
AUTH
========================= */

function register(){

const mail=email.value.trim();

const pass=password.value.trim();

if(!mail || !pass){

showPop("ЗАПОЛНИ ПОЛЯ");

return;

}

if(pass.length < 6){

showPop("МИНИМУМ 6 СИМВОЛОВ");

return;

}

auth
.createUserWithEmailAndPassword(mail,pass)

.then((u)=>{

currentUser=u.user;

showPop("REGISTER SUCCESS");

showPage("shop");

})

.catch((e)=>{

console.log(e);

if(e.code==="auth/email-already-in-use"){
showPop("EMAIL УЖЕ ЗАНЯТ");
}

else if(e.code==="auth/invalid-email"){
showPop("НЕПРАВИЛЬНЫЙ EMAIL");
}

else if(e.code==="auth/network-request-failed"){
showPop("НЕТ ИНТЕРНЕТА");
}

else{
showPop(e.code);
}

});

}

function login(){

const mail=email.value.trim();

const pass=password.value.trim();

if(!mail || !pass){

showPop("ЗАПОЛНИ ПОЛЯ");

return;

}

auth
.signInWithEmailAndPassword(mail,pass)

.then((u)=>{

currentUser=u.user;

showPop("LOGIN SUCCESS");

showPage("shop");

loadHistory();

})

.catch((e)=>{

console.log(e);

if(e.code==="auth/wrong-password"){
showPop("НЕВЕРНЫЙ ПАРОЛЬ");
}

else if(e.code==="auth/user-not-found"){
showPop("АККАУНТ НЕ НАЙДЕН");
}

else{
showPop(e.code);
}

});

}

auth.onAuthStateChanged((u)=>{

if(u){

currentUser=u;

loadHistory();

}

});

/* =========================
BUY
========================= */

function buyProduct(name,price){

if(!currentUser){

showPop("ВОЙДИТЕ");

return;

}

const code =
"CYB-" +
Math.random()
.toString(36)
.substr(2,8)
.toUpperCase();

const order = {

uid:currentUser.uid,

email:currentUser.email,

product:name,

price:price,

status:"ожидание оплаты",

code:code,

time:Date.now()

};

db.collection("orders")
.add(order)

.then(()=>{

showPop("ОЖИДАНИЕ ОПЛАТЫ");

openTonkeeper();

loadHistory();

});

}

/* =========================
HISTORY
========================= */

function loadHistory(){

if(!currentUser)return;

db.collection("orders")

.where("uid","==",currentUser.uid)

.orderBy("time","desc")

.onSnapshot((snap)=>{

const box =
document.getElementById("historyItems");

box.innerHTML="";

snap.forEach((doc)=>{

const o=doc.data();

box.innerHTML += `

<div class="orderBox">

<p>📦 ${o.product}</p>

<p>💎 ${o.price}</p>

<p>📄 ${o.status}</p>

<p>🔑 ${o.code}</p>

</div>

`;

});

});

}

/* =========================
ADMIN
========================= */

function adminLogin(){

if(
adminPassword.value
!== "rahim_45_pro"
){

showPop("НЕВЕРНЫЙ ПАРОЛЬ");

return;

}

showPop("ADMIN");

loadAdminOrders();

}

function loadAdminOrders(){

db.collection("orders")

.orderBy("time","desc")

.onSnapshot((snap)=>{

const box =
document.getElementById("adminOrders");

box.innerHTML="";

snap.forEach((doc)=>{

const o=doc.data();

box.innerHTML += `

<div class="orderBox">

<p>👤 ${o.email}</p>

<p>📦 ${o.product}</p>

<p>💎 ${o.price}</p>

<p>📄 ${o.status}</p>

<p>🔑 ${o.code}</p>

</div>

`;

});

});

}

/* =========================
TONKEEPER
========================= */

function openTonkeeper(){

window.open(
"ton://transfer/UQAYHaet-WWovXy7HoH84ud8cz_VjENJAmuEySnVe9aiw2Dv",
"_blank"
);

}

function copyWallet(){

navigator.clipboard.writeText(
walletAddress.innerText
);

showPop("СКОПИРОВАНО");

}

</script>

</body>
</html>
