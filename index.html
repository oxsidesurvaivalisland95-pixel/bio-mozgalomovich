<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CYBER MARKET X</title>

<style>

*{margin:0;padding:0;box-sizing:border-box;}

body{
font-family:Arial;
color:white;
min-height:100vh;
overflow-x:hidden;

background:
radial-gradient(circle at top left,#00ffe515,transparent 30%),
radial-gradient(circle at bottom right,#ff00ff12,transparent 30%),
linear-gradient(180deg,#05070d,#060912,#0a1020);
}

/* scanlines */
body::before{
content:"";
position:fixed;
inset:0;
pointer-events:none;
background:repeating-linear-gradient(
to bottom,
rgba(255,255,255,0.02),
rgba(255,255,255,0.02) 1px,
transparent 3px,
transparent 6px
);
animation:scan 6s linear infinite;
}

@keyframes scan{
0%{transform:translateY(0);}
100%{transform:translateY(10px);}
}

.header{
text-align:center;
padding:20px;
font-size:40px;
font-weight:bold;
color:#00ffe5;
text-shadow:0 0 20px #00ffe5,0 0 40px #ff00ff;
}

.nav{
display:flex;
justify-content:center;
gap:10px;
padding:10px;
background:rgba(0,0,0,0.4);
backdrop-filter:blur(10px);
}

button{
padding:10px;
border:none;
border-radius:10px;
cursor:pointer;
color:white;
background:linear-gradient(90deg,#00ffe5,#ff00ff);
transition:.2s;
}

button:hover{transform:scale(1.05);}

.page{display:none;padding:20px;}
.page.active{display:block;}

.card{
background:rgba(20,25,40,0.85);
border:1px solid #00ffe5;
padding:15px;
margin:10px auto;
max-width:420px;
border-radius:15px;
}

/* toast */
.toast{
position:fixed;
top:50%;
left:50%;
transform:translate(-50%,-50%);
background:#111;
border:1px solid #00ffe5;
padding:15px;
border-radius:10px;
animation:toast 1s forwards;
}

@keyframes toast{
0%{opacity:0;}
20%{opacity:1;}
80%{opacity:1;}
100%{opacity:0;}
}

/* cyber rain */
.rain{
position:fixed;
top:-50px;
color:#00ffe5;
font-size:14px;
opacity:0.8;
animation:fall linear forwards;
pointer-events:none;
text-shadow:0 0 10px #00ffe5;
}

@keyframes fall{
to{
transform:translateY(110vh);
opacity:0;
}
}

</style>
</head>

<body>

<div class="header">CYBER MARKET</div>

<div class="nav">
<button onclick="show('home')">HOME</button>
<button onclick="show('cart')">CART</button>
<button onclick="show('history')">HISTORY</button>
<button onclick="show('wallet')">WALLET</button>
<button onclick="show('admin')">ADMIN</button>
</div>

<!-- HOME -->
<div id="home" class="page active">

<div class="card">
<h3>1 неделя</h3>
<button onclick="add('1 неделя')">Добавить</button>
</div>

<div class="card">
<h3>1 месяц</h3>
<button onclick="add('1 месяц')">Добавить</button>
</div>

<div class="card">
<h3>Навсегда</h3>
<button onclick="add('Навсегда')">Добавить</button>
</div>

<div class="card">
<h3>Аккаунт</h3>
<input id="login">
<input id="pass" type="password">
<button onclick="register()">Регистрация</button>
<button onclick="login()">Вход</button>
</div>

</div>

<!-- CART -->
<div id="cart" class="page"></div>

<!-- HISTORY -->
<div id="history" class="page"></div>

<!-- WALLET -->
<div id="wallet" class="page">
<div class="card">
<h3>TON WALLET</h3>
<p id="walletText">UQAYHaet-WWovXy7HoH84ud8cz_VjENJAmuEySnVe9aiw2Dv</p>
<button onclick="copyWallet()">Скопировать</button>
</div>
</div>

<!-- ADMIN -->
<div id="admin" class="page">
<div class="card">
<h3>ADMIN</h3>
<input id="adminPass">
<button onclick="adminLogin()">Войти</button>
</div>
<div id="adminPanel"></div>
</div>

<script>

let users = JSON.parse(localStorage.getItem("users")||"{}");
let current = localStorage.getItem("current") || null;
let isAdmin = false;

/* storage per user */
function cartKey(){return "cart_"+current;}
function orderKey(){return "orders_"+current;}

function getCart(){return JSON.parse(localStorage.getItem(cartKey())||"[]");}
function getOrders(){return JSON.parse(localStorage.getItem(orderKey())||"[]");}

function saveCart(d){localStorage.setItem(cartKey(),JSON.stringify(d));}
function saveOrders(d){localStorage.setItem(orderKey(),JSON.stringify(d));}

/* nav */
function show(id){
document.querySelectorAll(".page").forEach(e=>e.classList.remove("active"));
document.getElementById(id).classList.add("active");
render();
}

/* toast */
function toast(t){
let d=document.createElement("div");
d.className="toast";
d.innerText=t;
document.body.appendChild(d);
setTimeout(()=>d.remove(),1000);
}

/* auth */
function register(){
let l=document.getElementById("login").value;
let p=document.getElementById("pass").value;
users[l]=p;
localStorage.setItem("users",JSON.stringify(users));
toast("ok");
}

function login(){
let l=document.getElementById("login").value;
let p=document.getElementById("pass").value;
if(users[l]===p){
current=l;
localStorage.setItem("current",l);
toast("вход");
render();
}
}

/* add */
function add(item){
if(!current) return toast("войдите");

let cart=getCart();
cart.push({user:current,item});
saveCart(cart);

toast("добавлено");
render();
}

/* code */
function code(){
return "CYB-"+Math.random().toString(36).substr(2,6).toUpperCase();
}

/* buy */
function buy(i){

let cart=getCart();
let orders=getOrders();

let c=code();

toast("ОЖИДАЙТЕ ОПЛАТЫ");

let wallet="UQAYHaet-WWovXy7HoH84ud8cz_VjENJAmuEySnVe9aiw2Dv";

setTimeout(()=>{
window.open(`ton://transfer/${wallet}?text=ORDER_${c}`,"_blank");
},800);

orders.push({...cart[i],status:"ожидание",code:c});

cart.splice(i,1);

saveCart(cart);
saveOrders(orders);

render();
}

/* delete */
function del(i){
let cart=getCart();
cart.splice(i,1);
saveCart(cart);
render();
}

/* admin */
function adminLogin(){
if(document.getElementById("adminPass").value==="rahim_45_pro"){
isAdmin=true;
toast("admin");
render();
}
}

function approve(i){
let o=getOrders();
o[i].status="оплачено";
saveOrders(o);
render();
}

function reject(i){
let o=getOrders();
o[i].status="отклонено";
saveOrders(o);
render();
}

/* render */
function render(){

/* cart */
let c=document.getElementById("cart");
let cart=getCart();
c.innerHTML="";
cart.forEach((e,i)=>{
c.innerHTML+=`
<div class="card">
${e.item}
<button onclick="buy(${i})">Купить</button>
<button onclick="del(${i})">Удалить</button>
</div>`;
});

/* history */
let h=document.getElementById("history");
let orders=getOrders();
h.innerHTML="";
orders.forEach(o=>{
h.innerHTML+=`
<div class="card">
${o.item} - ${o.status}<br>
<b>${o.code}</b>
</div>`;
});

/* admin */
if(isAdmin){
let a=document.getElementById("adminPanel");
a.innerHTML="";

let all=[];

for(let k in localStorage){
if(k.startsWith("orders_")){
all=all.concat(JSON.parse(localStorage.getItem(k)));
}
}

all.forEach((o,i)=>{
a.innerHTML+=`
<div class="card">
${o.user}<br>
${o.item}<br>
${o.status}<br>
<b>${o.code}</b><br><br>
<button onclick="approve(${i})">ОПЛАЧЕНО</button>
<button onclick="reject(${i})">ОТКЛОНИТЬ</button>
</div>`;
});
}
}

/* wallet */
function copyWallet(){
navigator.clipboard.writeText(document.getElementById("walletText").innerText);
toast("скопировано");
}

/* cyber rain */
setInterval(()=>{
let r=document.createElement("div");
r.className="rain";
r.innerText="|";
r.style.left=Math.random()*100+"vw";
r.style.animationDuration=(3+Math.random()*5)+"s";
document.body.appendChild(r);
setTimeout(()=>r.remove(),8000);
},120);

render();

</script>

</body>
</html>
