<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ULTRA SYSTEM</title>

<style>
html,body{
margin:0;
padding:0;
width:100%;
height:100%;
background:#02020a;
font-family:Arial;
color:white;
overflow-x:hidden;
}

/* 🌌 КИБЕРПАНК ФОН */
body::before{
content:"";
position:fixed;
inset:0;
background:
radial-gradient(circle at 20% 20%, rgba(0,255,255,0.18), transparent 40%),
radial-gradient(circle at 80% 30%, rgba(255,0,255,0.15), transparent 45%),
radial-gradient(circle at 50% 80%, rgba(0,140,255,0.12), transparent 50%),
linear-gradient(180deg, #02020a, #050510);
pointer-events:none;
z-index:0;
}

/* ❄ снег (без багов) */
#snowCanvas{
position:fixed;
inset:0;
width:100%;
height:100%;
pointer-events:none;
z-index:1;
filter:blur(0.2px);
}

/* страницы */
.page{
display:none;
padding:20px;
position:relative;
z-index:2;
}
.page.active{display:block}

/* 💎 КИБЕРПАНК КАРТОЧКИ */
.card{
background:rgba(10,10,20,0.85);
backdrop-filter:blur(10px);
max-width:340px;
margin:15px auto;
padding:20px;
border-radius:16px;
border:1px solid rgba(0,255,255,0.25);
box-shadow:
0 0 15px rgba(0,255,255,0.1),
0 0 40px rgba(255,0,255,0.08);
transition:0.25s;
}

/* NEON HOVER */
.card.product:hover{
transform:translateY(-8px) scale(1.04);
border:1px solid rgba(0,255,255,0.7);
box-shadow:
0 0 25px rgba(0,255,255,0.5),
0 0 60px rgba(255,0,255,0.3),
0 0 90px rgba(0,140,255,0.2);
}

/* INPUT */
input{
width:90%;
padding:10px;
border-radius:10px;
border:none;
margin-top:10px;
background:#0a0a12;
color:white;
outline:none;
box-shadow:0 0 10px rgba(0,255,255,0.1);
}

/* BUTTON */
button{
width:100%;
padding:12px;
margin-top:10px;
border:none;
border-radius:10px;
cursor:pointer;
background:linear-gradient(90deg,#00ffe5,#ff00ff,#008cff);
color:white;
font-weight:bold;
transition:0.2s;
box-shadow:0 0 15px rgba(0,255,255,0.2);
}

button:hover{
transform:scale(1.03);
box-shadow:0 0 25px rgba(0,255,255,0.6);
}

/* TITLE */
h1{
text-align:center;
font-size:42px;
background:linear-gradient(90deg,#00ffe5,#ff00ff,#008cff);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
filter:drop-shadow(0 0 10px rgba(0,255,255,0.3));
}

/* PRICE */
.price{
text-align:center;
opacity:0.85;
}

/* CLICK ANIMATION */
.card:active,
button:active{
transform:scale(0.97);
opacity:0.85;
}

/* 🔥 TOAST */
.toast{
position:fixed;
left:50%;
bottom:40px;
transform:translateX(-50%);
background:rgba(0,0,0,0.8);
padding:12px 18px;
border-radius:12px;
opacity:0;
transition:0.4s;
z-index:999;
border:1px solid rgba(0,255,255,0.4);
pointer-events:none;
}

.toast.show{
opacity:1;
transform:translateX(-50%) translateY(-10px);
}

/* admin glow */
.adminBtn{
position:fixed;
top:10px;
right:10px;
z-index:10;
cursor:pointer;
font-size:12px;
color:#00ffe5;
text-shadow:0 0 10px #00ffe5;
}
</style>
</head>

<body>

<canvas id="snowCanvas"></canvas>

<h1>ULTRA SYSTEM</h1>

<div id="toast" class="toast"></div>

<div class="adminBtn" onclick="show('login')">ADMIN</div>

<!-- HOME -->
<div id="home" class="page active">

<div class="card">
<h3>🔐 аккаунт</h3>

<input id="regName" placeholder="имя">
<input id="regPass" type="password" placeholder="пароль">

<button onclick="register()">регистрация</button>
<button onclick="loginUser()">вход</button>

<div id="userBox" style="display:none;text-align:center">
<p>👤 <span id="userName"></span></p>
<button onclick="logoutUser()">выйти</button>
</div>
</div>

<div class="card">
<h3>📩 заявка</h3>
<input id="tg" placeholder="@telegram">
<button onclick="send()">отправить</button>
</div>

<div class="card product" onclick="openPay('1 неделя','300₽ / 4$ / 2 TON')">
<h3>1 неделя</h3>
<p class="price">300₽ / 4$ / 2 TON</p>
</div>

<div class="card product" onclick="openPay('1 месяц','1000₽ / 13$ / 6 TON')">
<h3>1 месяц</h3>
<p class="price">1000₽ / 13$ / 6 TON</p>
</div>

<div class="card product" onclick="openPay('навсегда','4000₽ / 52$ / 25 TON')">
<h3>навсегда</h3>
<p class="price">4000₽ / 52$ / 25 TON</p>
</div>

</div>

<!-- PAY -->
<div id="pay" class="page">
<div class="card">

<h2 id="payTitle" style="text-align:center"></h2>
<p id="payPrice" style="text-align:center"></p>

<p style="text-align:center;cursor:pointer" onclick="openWallet()">
UQAYHaet-WWovXy7HoH84ud8cz_VjENJAmuEySnVe9aiw2Dv
</p>

<button onclick="openWallet()">💎 открыть в Tonkeeper</button>
<button onclick="copyWallet()">📋 копировать</button>
<button onclick="show('home')">назад</button>

</div>
</div>

<script>

const BOT_TOKEN="PUT_TOKEN_HERE";
const CHAT_ID="7910835075";
const WALLET="UQAYHaet-WWovXy7HoH84ud8cz_VjENJAmuEySnVe9aiw2Dv";

/* pages */
function show(id){
document.querySelectorAll(".page").forEach(p=>p.classList.remove("active"));
document.getElementById(id).classList.add("active");
}

/* pay */
function openPay(t,p){
document.getElementById("payTitle").innerText=t;
document.getElementById("payPrice").innerText=p;
show("pay");
}

/* TON */
function openWallet(){
window.location.href="https://app.tonkeeper.com/transfer/"+WALLET;
}

/* COPY */
function copyWallet(){
navigator.clipboard.writeText(WALLET);
toast("📋 скопировано");
}

/* TELEGRAM */
function send(){
let tg=document.getElementById("tg").value;
if(!tg)return;

fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`,{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({
chat_id:CHAT_ID,
text:`📩 ${tg}`
})
});

toast("📨 отправлено");
}

/* AUTH */
function register(){
let n=document.getElementById("regName").value;
let p=document.getElementById("regPass").value;
localStorage.setItem("user",JSON.stringify({n,p}));
showUser();
}

function loginUser(){
let u=JSON.parse(localStorage.getItem("user"));
let n=document.getElementById("regName").value;
let p=document.getElementById("regPass").value;

if(u && u.n===n && u.p===p){
showUser();
}else alert("неверно");
}

function showUser(){
let u=JSON.parse(localStorage.getItem("user"));
if(!u)return;
document.getElementById("userBox").style.display="block";
document.getElementById("userName").innerText=u.n;
}

function logoutUser(){
localStorage.removeItem("user");
document.getElementById("userBox").style.display="none";
}

/* toast */
function toast(msg){
let t=document.getElementById("toast");
t.innerText=msg;
t.classList.add("show");
setTimeout(()=>t.classList.remove("show"),1500);
}

/* ❄ СНЕГ (ЧИСТЫЙ БЕЗ ЛИСТЬЕВ) */
const c=document.getElementById("snowCanvas");
const x=c.getContext("2d");

function resize(){
c.width=innerWidth;
c.height=innerHeight;
}
resize();
window.addEventListener("resize",resize);

let s=[];
for(let i=0;i<90;i++){
s.push({
x:Math.random()*c.width,
y:Math.random()*c.height,
r:Math.random()*2.2
});
}

function draw(){
x.clearRect(0,0,c.width,c.height);
x.fillStyle="rgba(255,255,255,0.9)";

for(let i of s){
x.beginPath();
x.arc(i.x,i.y,i.r,0,Math.PI*2);
x.fill();

i.y+=1.2;
i.x+=Math.sin(i.y*0.01)*0.5;

if(i.y>c.height){
i.y=0;
i.x=Math.random()*c.width;
}
}

requestAnimationFrame(draw);
}
draw();

</script>

</body>
</html>
