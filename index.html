<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CYBER MARKET</title>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

<style>
body {
    margin: 0;
    font-family: 'Segoe UI', Arial, sans-serif;
    background: 
        radial-gradient(circle at top left, #00ffe522, transparent),
        radial-gradient(circle at bottom right, #ff00ff22, transparent),
        linear-gradient(180deg, #05070d, #060912, #0a1020);
    color: white;
    overflow-x: hidden;
    min-height: 100vh;
}

.header {
    text-align: center;
    padding: 20px 10px;
}

.header h1 {
    margin: 0;
    font-size: 34px;
    color: #00ffe5;
    text-shadow: 0 0 20px #00ffe5;
}

.user-tag {
    font-size: 14px;
    color: #ff00ff;
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-top: 5px;
}

.nav {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 8px;
    padding: 10px;
    background: rgba(0, 0, 0, 0.4);
    backdrop-filter: blur(10px);
    position: sticky;
    top: 0;
    z-index: 1000;
}

button {
    background: linear-gradient(90deg, #00ffe5, #ff00ff);
    border: none;
    padding: 10px 15px;
    border-radius: 10px;
    color: white;
    font-weight: bold;
    cursor: pointer;
    box-shadow: 0 0 10px rgba(0, 255, 229, 0.3);
    transition: 0.3s;
}

button:hover {
    transform: scale(1.05);
    box-shadow: 0 0 20px #00ffe5;
}

.page { display: none; padding: 20px; padding-bottom: 100px; }
.page.active { display: block; animation: fadeIn 0.5s; }

@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

.card {
    max-width: 420px;
    margin: 15px auto;
    padding: 20px;
    background: rgba(10, 12, 20, 0.85);
    border: 1px solid #00ffe5;
    border-radius: 12px;
    box-shadow: 0 0 15px rgba(0, 255, 229, 0.1);
}

input {
    width: 100%;
    padding: 12px;
    margin: 10px 0;
    border-radius: 8px;
    border: 1px solid #333;
    background: #000;
    color: white;
    box-sizing: border-box;
}

.toast {
    position: fixed;
    bottom: 100px;
    left: 50%;
    transform: translateX(-50%);
    background: #00ffe5;
    color: black;
    padding: 12px 20px;
    border-radius: 10px;
    font-weight: bold;
    animation: toast 2s ease forwards;
    z-index: 9999;
}

@keyframes toast {
    0% { opacity: 0; transform: translate(-50%, 20px); }
    15% { opacity: 1; transform: translate(-50%, 0); }
    85% { opacity: 1; transform: translate(-50%, 0); }
    100% { opacity: 0; transform: translate(-50%, -20px); }
}

.cyberRain {
    position: fixed;
    top: -50px;
    color: #00ffe5;
    font-size: 14px;
    pointer-events: none;
    z-index: -1;
    animation: fall linear forwards;
}

@keyframes fall { to { transform: translateY(110vh); opacity: 0; } }

.order {
    margin-top: 10px;
    padding: 12px;
    border: 1px solid #333;
    border-left: 4px solid #00ffe5;
    border-radius: 8px;
    background: rgba(255, 255, 255, 0.05);
}

.socials {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    display: flex;
    justify-content: center;
    gap: 15px;
    padding: 15px;
    background: rgba(0, 0, 0, 0.8);
    backdrop-filter: blur(5px);
}

.socials a { text-decoration: none; }
</style>
</head>

<body>

<div class="header">
    <h1>CYBER MARKET</h1>
    <div class="user-tag">@mozgalomovich</div>
</div>

<div class="nav">
    <button onclick="show('auth')">ACCOUNT</button>
    <button onclick="show('shop')">SHOP</button>
    <button onclick="show('cart')">CART</button>
    <button onclick="show('history')">HISTORY</button>
    <button onclick="show('admin')">ADMIN</button>
</div>

<!-- AUTH -->
<div id="auth" class="page active">
    <div class="card" id="authContent">
        <h3>ВХОД / РЕГИСТРАЦИЯ</h3>
        <input id="email" placeholder="Email">
        <input id="password" type="password" placeholder="Пароль">
        <button onclick="register()" style="width:48%">РЕГИСТРАЦИЯ</button>
        <button onclick="login()" style="width:48%">ВОЙТИ</button>
    </div>
</div>

<!-- SHOP -->
<div id="shop" class="page">
    <div class="card">
        <h3>1 неделя</h3>
        <p>300₽ / 4$ / 2💎</p>
        <button onclick="addCart('1 неделя', 2)">В КОРЗИНУ</button>
    </div>
    <div class="card">
        <h3>1 месяц</h3>
        <p>1000₽ / 13$ / 6💎</p>
        <button onclick="addCart('1 месяц', 6)">В КОРЗИНУ</button>
    </div>
    <div class="card">
        <h3>Навсегда</h3>
        <p>4000₽ / 52$ / 25💎</p>
        <button onclick="addCart('Навсегда', 25)">В КОРЗИНУ</button>
    </div>
</div>

<!-- CART -->
<div id="cart" class="page">
    <div class="card">
        <h3>ВАША КОРЗИНА</h3>
        <div id="cartBox">Корзина пуста</div>
        
        <div id="paymentBlock" style="display:none; margin-top:20px; border-top:1px solid #333; pt:10px;">
            <h4>ОПЛАТА ЧЕРЕЗ TON</h4>
            <p style="font-size:12px; color:#00ffe5;">Скопируйте адрес и переведите нужную сумму</p>
            <input id="wallet" value="UQAYHaet-WWovXy7HoH84ud8cz_VjENJAmuEySnVe9aiw2Dv" readonly>
            <button onclick="copyWallet()" style="width:100%; margin-bottom:5px;">СКОПИРОВАТЬ АДРЕС</button>
            <button onclick="openTon()" style="width:100%; background: #0088cc;">ОТКРЫТЬ TONKEEPER</button>
        </div>
    </div>
</div>

<!-- HISTORY -->
<div id="history" class="page">
    <div class="card">
        <h3>ИСТОРИЯ ЗАКАЗОВ</h3>
        <div id="hist">Войдите, чтобы видеть заказы</div>
    </div>
</div>

<!-- ADMIN -->
<div id="admin" class="page">
    <div class="card">
        <h3>ADMIN PANEL</h3>
        <input id="adm" type="password" placeholder="Admin Password">
        <button onclick="admin()" style="width:100%">ВОЙТИ В ПАНЕЛЬ</button>
        <div id="ordersList" style="margin-top:20px;"></div>
    </div>
</div>

<!-- SOCIALS -->
<div class="socials">
    <a href="https://t.me/bio_mozgalom" target="_blank">
        <button style="background:#0088cc">TELEGRAM</button>
    </a>
    <a href="https://www.tiktok.com/@mozgalomovich?_r=1&_t=ZS-96E1FTEA933" target="_blank">
        <button style="background:#000000; border:1px solid #ff00ff">TIKTOK</button>
    </a>
</div>

<script>
/* FIREBASE CONFIG */
let auth, db;
try {
    firebase.initializeApp({
        apiKey: "AIzaSyD94vjwnRQIYC-2Le_nmxtsVKlU6Oww6VE",
        authDomain: "mozgalom-site.firebaseapp.com",
        projectId: "mozgalom-site",
        storageBucket: "mozgalom-site.appspot.com",
        appId: "1:564649897907:web:61503121e661fb6a82a5c6"
    });
    auth = firebase.auth();
    db = firebase.firestore();
} catch(e) { console.error(e); }

/* NAVIGATION */
function show(id) {
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.getElementById(id).classList.add('active');
}

function toast(t) {
    const d = document.createElement("div");
    d.className = "toast";
    d.innerText = t;
    document.body.appendChild(d);
    setTimeout(() => d.remove(), 2000);
}

/* AUTH */
function register() {
    const e = email.value, p = password.value;
    if(!e || !p) return toast("ЗАПОЛНИТЕ ПОЛЯ");
    auth.createUserWithEmailAndPassword(e, p)
        .then(() => toast("УСПЕШНО ГRegistered"))
        .catch(err => toast("ОШИБКА"));
}

function login() {
    const e = email.value, p = password.value;
    auth.signInWithEmailAndPassword(e, p)
        .then(() => toast("ВХОД ВЫПОЛНЕН"))
        .catch(() => toast("ОШИБКА ВХОДА"));
}

function logout() {
    auth.signOut().then(() => location.reload());
}

/* SHOP & CART */
let cart = [];
function addCart(n, p) {
    cart.push({n, p});
    toast("ДОБАВЛЕНО В КОРЗИНУ");
    renderCart();
}

function renderCart() {
    const box = document.getElementById("cartBox");
    const pBlock = document.getElementById("paymentBlock");
    
    if (cart.length === 0) {
        box.innerHTML = "Корзина пуста";
        pBlock.style.display = "none";
        return;
    }
    
    pBlock.style.display = "block";
    box.innerHTML = cart.map((item, index) => `
        <div class="order">
            <b>${item.n}</b> — ${item.p}💎
            <div style="margin-top:10px;">
                <button onclick="confirmBuy('${item.n}', ${item.p}, ${index})" style="padding:5px 10px; font-size:12px;">ОФОРМИТЬ</button>
                <button onclick="removeItem(${index})" style="padding:5px 10px; font-size:12px; background:red;">УДАЛИТЬ</button>
            </div>
        </div>
    `).join("");
}

function removeItem(i) {
    cart.splice(i, 1);
    renderCart();
}

function confirmBuy(n, p, index) {
    if(!auth.currentUser) return toast("НУЖНО ВОЙТИ");
    
    db.collection("orders").add({
        uid: auth.currentUser.uid,
        email: auth.currentUser.email,
        product: n,
        price: p,
        code: "CYB-" + Math.random().toString(36).slice(2, 9).toUpperCase(),
        status: "pending",
        time: Date.now()
    }).then(() => {
        toast("ЗАКАЗ СОЗДАН! ЖДЕМ ОПЛАТЫ");
        cart.splice(index, 1);
        renderCart();
        show('history');
    });
}

/* AUTH STATE & HISTORY */
auth.onAuthStateChanged(user => {
    if (user) {
        document.getElementById("authContent").innerHTML = `
            <h3>ПРОФИЛЬ</h3>
            <p>Email: ${user.email}</p>
            <button onclick="logout()" style="width:100%">ВЫЙТИ</button>
        `;
        
        db.collection("orders").where("uid", "==", user.uid).orderBy("time", "desc")
          .onSnapshot(snap => {
              const h = document.getElementById("hist");
              if(snap.empty) return h.innerHTML = "Заказов пока нет";
              h.innerHTML = snap.docs.map(doc => {
                  const d = doc.data();
                  const color = d.status === 'paid' ? '#00ff00' : '#ff00ff';
                  return `<div class="order" style="border-color:${color}">
                      <b>${d.product}</b><br>
                      Код: ${d.code} | <span style="color:${color}">${d.status.toUpperCase()}</span>
                  </div>`;
              }).join("");
          });
    }
});

/* ADMIN */
function admin() {
    if(document.getElementById("adm").value !== "rahim_45_pro") return toast("ДОСТУП ЗАПРЕЩЕН");
    
    db.collection("orders").orderBy("time", "desc").onSnapshot(snap => {
        document.getElementById("ordersList").innerHTML = snap.docs.map(doc => `
            <div class="order" style="font-size:12px;">
                Юзер: ${doc.data().email}<br>
                Товар: ${doc.data().product} (${doc.data().code})<br>
                Статус: ${doc.data().status}<br>
                <button onclick="updateStatus('${doc.id}', 'paid')">ОПЛАЧЕНО</button>
                <button onclick="updateStatus('${doc.id}', 'del')" style="background:red">УДАЛИТЬ</button>
            </div>
        `).join("");
    });
}

function updateStatus(id, type) {
    if(type === 'paid') db.collection("orders").doc(id).update({status: "paid"});
    else db.collection("orders").doc(id).delete();
    toast("ОБНОВЛЕНО");
}

/* UTILS */
function copyWallet() {
    navigator.clipboard.writeText(document.getElementById("wallet").value);
    toast("АДРЕС СКОПИРОВАН");
}

function openTon() {
    window.location.href = "tonkeeper://";
}

/* CYBER RAIN */
setInterval(() => {
    const r = document.createElement("div");
    r.className = "cyberRain";
    r.innerText = Math.random() > 0.5 ? "1" : "0";
    r.style.left = Math.random() * 100 + "vw";
    r.style.animationDuration = (2 + Math.random() * 3) + "s";
    document.body.appendChild(r);
    setTimeout(() => r.remove(), 5000);
}, 150);
</script>

</body>
</html>
