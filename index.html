<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MOZGALOM MARKET</title>

    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

    <style>
        :root { --n: #00ffe5; --p: #ff00ff; --bg: #05070d; }
        body { 
            margin:0; font-family: 'Segoe UI', sans-serif; background: var(--bg); color:white; 
            display: flex; flex-direction: column; min-height: 100vh;
        }

        /* Шапка */
        .header { text-align:center; padding:30px 10px; border-bottom: 1px solid var(--n); }
        h1 { margin:0; font-size:32px; color: var(--n); text-shadow: 0 0 15px var(--n); text-transform: uppercase; }

        /* Навигация - теперь кнопки не тормозят */
        .nav { 
            display:flex; justify-content:center; gap:8px; padding:12px; 
            background: rgba(10, 15, 30, 0.9); position:sticky; top:0; z-index:100;
            border-bottom: 1px solid var(--n); flex-wrap: wrap;
        }

        button { 
            background: linear-gradient(45deg, var(--n), var(--p)); 
            border: none; padding: 10px 15px; border-radius: 8px; 
            color: white; font-weight: bold; cursor: pointer;
        }

        /* Контент - исправил обрезание */
        .page { display:none; padding:15px; width: 100%; box-sizing: border-box; }
        .page.active { display:block; }

        .card { 
            background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(0, 255, 229, 0.2);
            border-radius: 15px; padding: 20px; margin-bottom: 15px; text-align: center;
        }

        input { width:100%; padding:12px; margin:8px 0; border-radius:8px; border:1px solid #333; background:#000; color:white; box-sizing: border-box; }

        /* Кошелек */
        .wallet-box {
            background: #111; border: 1px dashed var(--n); padding: 15px; border-radius: 10px; margin: 15px 0;
            cursor: pointer; transition: 0.3s;
        }
        .wallet-box:active { background: var(--n); color: #000; }

        /* Футер (Твои ссылки) */
        footer {
            background: #000; padding: 30px 10px; text-align: center;
            border-top: 1px solid var(--p); margin-top: auto;
        }
        .footer-links { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; margin-bottom: 15px; }
        .footer-links a {
            color: white; text-decoration: none; font-weight: bold; font-size: 12px;
            padding: 10px 15px; border: 1px solid var(--p); border-radius: 20px;
        }

        /* Оптимизированный фон (не лагает) */
        #bg-canvas { position: fixed; top: 0; left: 0; z-index: -1; opacity: 0.2; }
    </style>
</head>
<body>

<canvas id="bg-canvas"></canvas>

<div class="header">
    <h1>MOZGALOM</h1>
</div>

<div class="nav">
    <button onclick="show('shop')">МАРКЕТ</button>
    <button onclick="show('wallet')">КОШЕЛЕК</button>
    <button onclick="show('auth')">АККАУНТ</button>
    <button onclick="show('history')">ЗАКАЗЫ</button>
</div>

<!-- МАГАЗИН -->
<div id="shop" class="page active">
    <div class="card">
        <h3>1 НЕДЕЛЯ (PRO)</h3>
        <p style="color:var(--n); font-size:20px; font-weight:bold;">300₽ / 2 TON</p>
        <button onclick="buy('1 НЕДЕЛЯ','300₽')" style="width:100%">КУПИТЬ</button>
    </div>
    <div class="card">
        <h3>1 МЕСЯЦ (ULTRA)</h3>
        <p style="color:var(--n); font-size:20px; font-weight:bold;">1000₽ / 6 TON</p>
        <button onclick="buy('1 МЕСЯЦ','1000₽')" style="width:100%">КУПИТЬ</button>
    </div>
</div>

<!-- КОШЕЛЕК -->
<div id="wallet" class="page">
    <div class="card">
        <h3>ОПЛАТА TON</h3>
        <p>Нажмите на адрес, чтобы скопировать:</p>
        <div class="wallet-box" onclick="copyWallet()">
            <strong id="wallet-addr">UQB1...ВАШ_АДРЕС...</strong>
        </div>
        <p style="font-size:12px; color:var(--p)">После оплаты заказ будет активирован админом.</p>
    </div>
</div>

<!-- АККАУНТ -->
<div id="auth" class="page">
    <div class="card" id="authContent">
        <h3>ВХОД</h3>
        <input id="u_mail" type="email" placeholder="Email">
        <input id="u_pass" type="password" placeholder="Пароль">
        <button onclick="doLogin()" style="width:100%">ВОЙТИ</button>
        <button onclick="loginGoogle()" style="width:100%; margin-top:10px; background:white; color:black">GOOGLE</button>
    </div>
</div>

<!-- ИСТОРИЯ -->
<div id="history" class="page">
    <div class="card">
        <h3>ИСТОРИЯ</h3>
        <div id="h_list">Пусто...</div>
    </div>
</div>

<footer>
    <div class="footer-links">
        <a href="https://t.me/bio_mozgalom" target="_blank">✈️ НАШ КАНАЛ</a>
        <a href="https://www.tiktok.com/@mozgalomovich" target="_blank">🎵 TIKTOK</a>
        <a href="https://t.me/mozgalomovich" target="_blank" style="border-color:#0f0">💬 АДМИН</a>
    </div>
    <div style="font-size:10px; opacity:0.5;">MOZGALOM 2026</div>
</footer>

<script>
const TG_TOKEN = "8538869779:AAGSu2F22Tx0TAtRH2gXPlF4ZNsPVKTt3lw";
const TG_CHAT_ID = "7910835075";

const firebaseConfig = {
    apiKey: "AIzaSyD94vjwnRQIYC-2Le_nmxtsVKlU6Oww6VE",
    authDomain: "mozgalom-site.firebaseapp.com",
    projectId: "mozgalom-site",
    storageBucket: "mozgalom-site.appspot.com",
    appId: "1:564649897907:web:61503121e661fb6a82a5c6"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

function show(id) { 
    document.querySelectorAll('.page').forEach(p=>p.classList.remove('active')); 
    document.getElementById(id).classList.add('active'); 
}

function copyWallet() {
    const addr = document.getElementById('wallet-addr').innerText;
    navigator.clipboard.writeText(addr);
    alert("Адрес скопирован!");
}

function buy(name, price) {
    if(!auth.currentUser) return alert("Войдите в аккаунт!");
    const promo = prompt("Промокод:");
    let finalPrice = price;
    if(promo && promo.toLowerCase() === 'fullter2026') {
        finalPrice = "СКИДКА (fullter2026)";
        alert("Промокод активирован!");
    }
    const orderId = "MZ-" + Math.random().toString(36).substr(2,6).toUpperCase();
    db.collection("orders").add({
        uid: auth.currentUser.uid,
        email: auth.currentUser.email,
        product: name,
        price: finalPrice,
        code: orderId,
        status: "pending",
        time: Date.now()
    }).then(() => {
        const text = `🚀 ЗАКАЗ\nТовар: ${name}\nЮзер: ${auth.currentUser.email}\nЦена: ${finalPrice}\nID: ${orderId}`;
        fetch(`https://api.telegram.org/bot${TG_TOKEN}/sendMessage?chat_id=${TG_CHAT_ID}&text=${encodeURIComponent(text)}`, {mode:'no-cors'});
        alert("Заказ создан! Оплатите в разделе КОШЕЛЕК.");
        show('history');
    });
}

// Управление аккаунтом
auth.onAuthStateChanged(u => {
    if(u) {
        document.getElementById("authContent").innerHTML = `<h3>АККАУНТ</h3><p>${u.email}</p><button onclick="auth.signOut().then(()=>location.reload())" style="width:100%">ВЫЙТИ</button>`;
        db.collection("orders").where("uid","==",u.uid).onSnapshot(s => {
            document.getElementById("h_list").innerHTML = s.docs.map(d => {
                const x = d.data();
                return `<div style="border-bottom:1px solid #333; padding:10px;">${x.product} - ${x.status=='paid'?'ОПЛАЧЕНО ✅':'ЖДЕМ ⏳'}</div>`;
            }).join("");
        });
    }
});

function doLogin() {
    const e = document.getElementById("u_mail").value, p = document.getElementById("u_pass").value;
    auth.signInWithEmailAndPassword(e,p).then(()=>location.reload());
}

function loginGoogle() { auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()).then(()=>location.reload()); }

// ЛЕГКАЯ АНИМАЦИЯ ФОНА (НЕ ТОРМОЗИТ)
const canvas = document.getElementById('bg-canvas');
const ctx = canvas.getContext('2d');
canvas.width = window.innerWidth; canvas.height = window.innerHeight;
const drops = Array(Math.floor(canvas.width/20)).fill(0);
function draw() {
    ctx.fillStyle = 'rgba(5, 7, 13, 0.1)'; ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#00ffe5'; ctx.font = '15px monospace';
    drops.forEach((y, i) => {
        ctx.fillText(Math.floor(Math.random()*2), i*20, y);
        if(y > canvas.height && Math.random() > 0.975) drops[i] = 0;
        else drops[i] += 20;
    });
}
setInterval(draw, 50);
</script>
</body>
</html>
