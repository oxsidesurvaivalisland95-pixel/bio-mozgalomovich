<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CYBER RESTORED</title>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

<style>

body{
margin:0;
font-family:Arial;
background:
radial-gradient(circle,#00ffe522,transparent),
radial-gradient(circle,#ff00ff22,transparent),
#05070d;
color:white;
overflow-x:hidden;
}

.header{
text-align:center;
padding:20px;
font-size:30px;
color:#00ffe5;
text-shadow:0 0 15px #00ffe5;
}

.nav{
display:flex;
justify-content:center;
gap:10px;
padding:10px;
}

button{
background:linear-gradient(90deg,#00ffe5,#ff00ff);
border:none;
padding:10px 14px;
border-radius:10px;
color:white;
cursor:pointer;
}

.page{display:none;padding:20px;}
.page.active{display:block;}

.card{
max-width:420px;
margin:10px auto;
padding:15px;
background:#111827;
border:1px solid #00ffe5;
border-radius:12px;
}

input{
width:100%;
padding:10px;
margin-top:10px;
border:none;
border-radius:8px;
}

.order{
margin-top:10px;
padding:10px;
border:1px solid #00ffe5;
border-radius:10px;
}

.toast{
position:fixed;
bottom:20px;
left:50%;
transform:translateX(-50%);
background:#00ffe5;
color:black;
padding:10px;
border-radius:8px;
}

.cyberRain{
position:fixed;
top:-50px;
color:#00ffe5;
animation:fall linear forwards;
}

@keyframes fall{
to{transform:translateY(110vh);opacity:0;}
}

</style>
</head>

<body>

<div class="header">CYBER RESTORED</div>

<div class="nav">
<button onclick="show('auth')">AUTH</button>
<button onclick="show('shop')">SHOP</button>
<button onclick="show('cart')">CART</button>
<button onclick="show('history')">HISTORY</button>
<button onclick="show('admin')">ADMIN</button>
</div>

<!-- AUTH -->
<div id="auth" class="page active">
<div class="card">
<h3>AUTH</h3>
<input id="email" placeholder="email">
<input id="password" type="password" placeholder="password">
<button onclick="register()">REGISTER</button>
<button onclick="login()">LOGIN</button>
</div>
</div>

<!-- SHOP -->
<div id="shop" class="page">
<div class="card">
<h3>SHOP</h3>
<button onclick="addCart('1 week',2)">1 WEEK</button>
<button onclick="addCart('1 month',6)">1 MONTH</button>
<button onclick="addCart('forever',25)">FOREVER</button>
</div>
</div>

<!-- CART -->
<div id="cart" class="page">
<div class="card">
<h3>CART</h3>
<div id="cartBox"></div>
</div>
</div>

<!-- HISTORY -->
<div id="history" class="page">
<div class="card">
<h3>HISTORY</h3>
<div id="hist"></div>
</div>
</div>

<!-- ADMIN -->
<div id="admin" class="page">
<div class="card">
<h3>ADMIN</h3>
<input id="adm" placeholder="password">
<button onclick="admin()">ENTER</button>
<div id="orders"></div>
</div>
</div>

<!-- WALLET -->
<div class="card">
<h3>WALLET</h3>
<input id="wallet" value="UQAYHaet-WWovXy7HoH84ud8cz_VjENJAmuEySnVe9aiw2Dv" readonly>
<button onclick="copyWallet()">COPY</button>
<button onclick="openTon()">TONKEEPER</button>
</div>

<script>

/* SAFE INIT */
let auth=null;
let db=null;

try{
firebase.initializeApp({
apiKey:"AIzaSyD94vjwnRQIYC-2Le_nmxtsVKlU6Oww6VE",
authDomain:"mozgalom-site.firebaseapp.com",
projectId:"mozgalom-site",
storageBucket:"mozgalom-site.appspot.com",
appId:"1:564649897907:web:61503121e661fb6a82a5c6"
});

auth=firebase.auth();
db=firebase.firestore();

}catch(e){console.log(e);}

/* UI */
function show(id){
document.querySelectorAll(".page").forEach(p=>p.classList.remove("active"));
document.getElementById(id).classList.add("active");
}

/* TOAST */
function toast(t){
const d=document.createElement("div");
d.className="toast";
d.innerText=t;
document.body.appendChild(d);
setTimeout(()=>d.remove(),1500);
}

/* AUTH FIXED */
function register(){
auth.createUserWithEmailAndPassword(email.value,password.value)
.then(()=>toast("REGISTER OK"))
.catch(e=>toast(e.message));
}

function login(){
auth.signInWithEmailAndPassword(email.value,password.value)
.then(()=>toast("LOGIN OK"))
.catch(e=>toast(e.message));
}

/* CART RESTORED */
let cart=[];

function addCart(n,p){
cart.push({n,p});
renderCart();
toast("ADDED");
}

function renderCart(){
cartBox.innerHTML=cart.map((i,k)=>`
<div class="order">
${i.n} - ${i.p}
<button onclick="buy('${i.n}',${i.p})">BUY</button>
<button onclick="removeItem(${k})">DELETE</button>
</div>
`).join("");
}

function removeItem(i){
cart.splice(i,1);
renderCart();
toast("REMOVED");
}

/* BUY */
function buy(n,p){
db.collection("orders").add({
uid:auth.currentUser.uid,
email:auth.currentUser.email,
product:n,
price:p,
code:"CYB-"+Math.random().toString(36).slice(2,10),
status:"pending",
time:Date.now()
});
toast("ORDER SENT");
}

/* HISTORY FIXED */
auth.onAuthStateChanged(u=>{
if(!u) return;

db.collection("orders")
.where("uid","==",u.uid)
.onSnapshot(s=>{
hist.innerHTML=s.docs.map(d=>`
<div class="order">
${d.data().product} | ${d.data().code} | ${d.data().status}
</div>
`).join("");
});
});

/* ADMIN */
function admin(){
if(adm.value!=="rahim_45_pro") return;

db.collection("orders").onSnapshot(s=>{
orders.innerHTML=s.docs.map(d=>`
<div class="order">
${d.data().email}<br>
${d.data().product}<br>
${d.data().code}<br>
${d.data().status}<br>
<button onclick="paid('${d.id}')">PAID</button>
<button onclick="del('${d.id}')">DEL</button>
</div>
`).join("");
});
}

function paid(id){
db.collection("orders").doc(id).update({status:"paid"});
}

function del(id){
db.collection("orders").doc(id).delete();
}

/* WALLET */
function copyWallet(){
navigator.clipboard.writeText(wallet.value);
toast("COPIED");
}

function openTon(){
window.location.href="tonkeeper://";
setTimeout(()=>{
window.open("https://tonviewer.com/"+wallet.value,"_blank");
},400);
}

/* CYBER RAIN RESTORED */
setInterval(()=>{
const r=document.createElement("div");
r.className="cyberRain";
r.innerText="|";
r.style.left=Math.random()*100+"vw";
r.style.animationDuration=(2+Math.random()*4)+"s";
document.body.appendChild(r);
setTimeout(()=>r.remove(),7000);
},80);

</script>

</body>
</html>
