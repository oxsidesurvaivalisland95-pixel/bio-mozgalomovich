<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CYBER MARKET FULL WORKING</title>

<style>

body{
margin:0;
font-family:Arial;
background:#05070d;
color:white;
overflow-x:hidden;
}

.header{
text-align:center;
padding:18px;
font-size:30px;
color:#00ffe5;
text-shadow:0 0 15px #00ffe5;
}

.nav{
display:flex;
flex-wrap:wrap;
justify-content:center;
gap:8px;
padding:10px;
background:#0a0f1a;
}

button{
background:#00ffe5;
border:none;
padding:10px;
border-radius:6px;
cursor:pointer;
}

.page{display:none;padding:15px;}
.page.active{display:block;}

.card{
background:#111a2a;
border:1px solid #00ffe5;
padding:15px;
margin:10px auto;
border-radius:10px;
max-width:420px;
}

input{
padding:10px;
margin:5px;
width:90%;
}

.pop{
position:fixed;
top:50%;
left:50%;
transform:translate(-50%,-50%);
background:black;
border:1px solid #00ffe5;
padding:10px;
animation:fade 1s forwards;
z-index:9999;
}

@keyframes fade{
0%{opacity:1;}
100%{opacity:0;}
}

.rain{
position:fixed;
top:-50px;
color:#00ffe5;
pointer-events:none;
animation:fall linear forwards;
}

@keyframes fall{
to{transform:translateY(110vh);opacity:0;}
}

</style>
</head>

<body>

<div class="header">CYBER MARKET LIVE</div>

<div class="nav">
<button onclick="show('auth')">AUTH</button>
<button onclick="show('shop')">SHOP</button>
<button onclick="show('cart')">CART</button>
<button onclick="show('history')">HISTORY</button>
<button onclick="show('wallet')">WALLET</button>
<button onclick="show('admin')">ADMIN</button>
<button onclick="show('live')">LIVE</button>
</div>

<!-- AUTH -->
<div id="auth" class="page active">
<div class="card">
<h3>LOGIN / REGISTER</h3>
<input id="email" placeholder="email">
<input id="pass" type="password" placeholder="password">
<button onclick="register()">register</button>
<button onclick="login()">login</button>
</div>
</div>

<!-- SHOP -->
<div id="shop" class="page">

<div class="card">
<h3>1 неделя</h3>
<p>300₽</p>
<button onclick="add('1 неделя',2)">buy</button>
</div>

<div class="card">
<h3>1 месяц</h3>
<p>1000₽</p>
<button onclick="add('1 месяц',6)">buy</button>
</div>

<div class="card">
<h3>навсегда</h3>
<p>4000₽</p>
<button onclick="add('навсегда',25)">buy</button>
</div>

</div>

<!-- CART -->
<div id="cart" class="page"></div>

<!-- HISTORY -->
<div id="history" class="page"></div>

<!-- WALLET -->
<div id="wallet" class="page">

<div class="card">
<h3>TON WALLET</h3>
<p id="walletText">UQAYHaet-WWovXy7HoH84ud8cz_VjENJAmuEySnVe9aiw2Dv</p>
<button onclick="openWallet()">Tonkeeper</button>
<button onclick="copyWallet()">Copy</button>
</div>

</div>

<!-- ADMIN -->
<div id="admin" class="page">

<div class="card">
<h3>ADMIN</h3>
<input id="adminPass" placeholder="password">
<button onclick="adminLogin()">enter</button>
</div>

<div class="card">
<h3>LIVE ORDERS</h3>
<div id="live"></div>
</div>

</div>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

<script>

let auth,db,user,ready=false;

function show(id){
document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
document.getElementById(id).classList.add('active');
}

function pop(t){
let d=document.createElement("div");
d.className="pop";
d.innerText=t;
document.body.appendChild(d);
setTimeout(()=>d.remove(),1000);
}

/* FIREBASE INIT */
function init(){

try{

firebase.initializeApp({
apiKey:"YOUR",
authDomain:"YOUR",
projectId:"YOUR",
appId:"YOUR"
});

auth=firebase.auth();
db=firebase.firestore();

ready=true;

auth.onAuthStateChanged(u=>{
if(u){
user=u;
show("shop");
listen();
}
});

}catch(e){
console.log("firebase error",e);
}

}

/* REGISTER */
function register(){
auth.createUserWithEmailAndPassword(email.value,pass.value)
.then(u=>{
user=u.user;
show("shop");
})
.catch(e=>pop(e.message));
}

/* LOGIN */
function login(){
auth.signInWithEmailAndPassword(email.value,pass.value)
.then(u=>{
user=u.user;
show("shop");
listen();
})
.catch(e=>pop(e.message));
}

/* ADD */
function add(item,price){
if(!user)return pop("login first");

db.collection("orders").add({
item,
price,
uid:user.uid,
time:Date.now(),
code:"CYB-"+Math.random().toString(36).substr(2,6)
});

pop("added");
}

/* LIVE */
function listen(){

db.collection("orders")
.orderBy("time","desc")
.onSnapshot(snap=>{

let l=document.getElementById("live");
if(!l)return;

l.innerHTML="";

snap.forEach(d=>{
let o=d.data();
l.innerHTML+=`
<div class="card">
${o.item}<br>
${o.uid}<br>
${o.code}
</div>`;
});

});

}

/* WALLET */
function openWallet(){
window.open("ton://transfer/UQAYHaet-WWovXy7HoH84ud8cz_VjENJAmuEySnVe9aiw2Dv");
}

function copyWallet(){
navigator.clipboard.writeText(walletText.innerText);
pop("copied");
}

/* ADMIN */
function adminLogin(){
if(adminPass.value==="rahim_45_pro"){
listen();
pop("admin ok");
}
}

/* RAIN */
setInterval(()=>{
let r=document.createElement("div");
r.className="rain";
r.innerText="|";
r.style.left=Math.random()*100+"vw";
r.style.animationDuration=(3+Math.random()*5)+"s";
document.body.appendChild(r);
setTimeout(()=>r.remove(),8000);
},120);

/* START */
window.onload=init;

</script>

</body>
</html>
